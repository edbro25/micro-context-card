<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Card · animated</title>
  <style>
    :root { --ink: #1d1d1b; --cream: #f6f1e7; --orange: #e4572e; --yellow: #f3a712; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--cream); color: var(--ink);
      font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; overflow: hidden; }

    /* ---------- Artwork ---------- */
    .art { position: relative; flex: 1; min-height: 0; margin: 2.5vmin 2.5vmin 0; border: 1.6vmin solid var(--ink); overflow: hidden;
      animation: frame-in .5s ease-out both; }
    .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .s { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.2,.9,.3,1.35) both; animation-delay: calc(var(--i) * 55ms); }
    .s > * { transform-box: fill-box; transform-origin: center; stroke: var(--ink); stroke-width: 2; }
    .bob > * { animation: bob 3.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.41s); }
    .spin > * { animation: spin 11s linear infinite; animation-delay: calc(var(--i) * -.9s); }
    .sway > * { animation: sway 4.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.33s); }
    .draw { fill: none; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100;
      animation: draw 1.6s ease-out forwards, breathe 5s ease-in-out 1.6s infinite; animation-delay: calc(var(--i) * 120ms + .4s), calc(var(--i) * 120ms + 2s); }

    .panel { position: absolute; left: 3.5%; top: 5%; padding: 1.4vmin 2.6vmin 1.8vmin; background: var(--ink); color: var(--cream);
      line-height: .92; font-weight: 800; letter-spacing: -.02em; animation: slide-in .7s cubic-bezier(.2,.8,.2,1) .25s both; }
    .panel b { display: block; font-size: 9.5vmin; }
    .panel b + b { color: var(--yellow); display: inline-block; }
    .panel small { font-size: 2.6vmin; font-weight: 500; letter-spacing: 0; margin-left: 1vmin; }

    .qr { position: absolute; right: 4%; top: 5%; display: grid; grid-template-columns: repeat(5, 3vmin); gap: .5vmin; padding: .8vmin;
      border: .6vmin solid var(--ink); background: var(--cream); animation: pop .6s ease-out .5s both; }
    .qr i { width: 3vmin; height: 3vmin; background: var(--ink); animation: flicker 2.6s steps(1) infinite; animation-delay: calc(var(--i) * -.37s); }
    .qr i:nth-child(3n) { background: transparent; }

    .big { position: absolute; right: 5%; bottom: 2%; font-size: 26vmin; font-weight: 900; line-height: .9; letter-spacing: -.04em;
      color: var(--orange); -webkit-text-stroke: .9vmin var(--ink); paint-order: stroke fill;
      animation: rise .8s cubic-bezier(.2,.9,.3,1.3) .6s both, pulse 2.4s ease-in-out 1.6s infinite; transform-origin: 70% 90%; }

    /* ---------- Actions (counted by the Context Canvas camera) ---------- */
    .actions { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6vmin; padding: 2.2vmin 2.5vmin 2.8vmin; }
    .actions button { font: 650 clamp(11px, 3.4vmin, 15px)/1 -apple-system, system-ui, sans-serif; color: var(--ink); background: #fff;
      border: 2px solid var(--ink); border-radius: 999px; padding: 1.7vmin 3vmin; cursor: pointer; transition: transform .12s, background .2s, color .2s;
      animation: pop .5s ease-out both; animation-delay: calc(var(--i) * 70ms + .9s); }
    .actions button:active { transform: scale(.94); }
    .actions .buy { background: var(--orange); color: #fff; animation: pop .5s ease-out 1.3s both, nudge 2.8s ease-in-out 2.4s infinite; }
    /* The ✓ space is always reserved, so buttons never shift under a finger when one is marked done. */
    .actions [data-action]::after { content: " ✓"; visibility: hidden; }
    .actions [data-done] { background: var(--ink); color: var(--cream); animation: none; }
    .actions [data-done]::after { visibility: visible; }

    @keyframes frame-in { from { opacity: 0; transform: scale(.97); } }
    @keyframes pop { from { opacity: 0; transform: scale(0); } }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sway { 50% { transform: rotate(8deg) translateX(3px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes breathe { 50% { opacity: .55; } }
    @keyframes slide-in { from { opacity: 0; transform: translateX(-30%); } }
    @keyframes flicker { 50% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(40%) scale(.6); } }
    @keyframes pulse { 50% { transform: scale(1.05) rotate(-2deg); } }
    @keyframes nudge { 0%, 80%, 100% { transform: none; } 88% { transform: translateX(-3px); } 94% { transform: translateX(3px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .draw { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

      <g class="s spin" style="--i:22"><polygon points="352,140 386,126 372,176" fill="#1f9d55"/></g>
      <g class="s sway" style="--i:23"><polygon points="272,214 238,190 248,228" fill="#2f6df6"/></g>
      <g class="s spin" style="--i:24"><polygon points="36,142 72,128 58,164" fill="#1d1d1b"/></g>

      <!-- squares -->
      <g class="s bob" style="--i:25"><rect x="230" y="64" width="20" height="20" fill="#f3a712"/></g>
      <g class="s sway" style="--i:26"><rect x="270" y="78" width="26" height="14" fill="#2f6df6"/></g>

      <g class="s sway" style="--i:28"><rect x="286" y="128" width="28" height="22" fill="#17bebb"/></g>

      <g class="s sway" style="--i:30"><rect x="24" y="200" width="28" height="14" fill="#f3a712"/></g>

      <g class="s bob" style="--i:33"><rect x="128" y="276" width="22" height="20" fill="#d7263d"/></g>
    </svg>

    <div class="panel"><b>CONTEXT</b><b>CARD</b><small>trigger · step 1</small></div>
    <div class="qr" aria-hidden="true">
      <i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
      <i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i>
      <i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
      <i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i><i style="--i:20"></i>
      <i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i><i style="--i:24"></i><i style="--i:25"></i>
    </div>
    <div class="big">01</div>
  </div>

  <!-- Each data-action is counted by the Context Canvas camera (once per impression). No JavaScript needed here. -->
  <nav class="actions">
    <button data-action="like" style="--i:0">♥ Like</button>
    <button data-action="save" style="--i:1">Save</button>
    <button data-action="share" style="--i:2">Share</button>
    <button data-action="follow" style="--i:3">Follow</button>
    <button data-action="learn-more" style="--i:4">Learn more</button>
    <button class="buy" data-action="buy">Buy <span data-price></span></button>
  </nav>
</body>
</html>
