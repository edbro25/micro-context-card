<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Watching from home</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: -apple-system, system-ui, sans-serif; color: #1d1d1b; background: #f6f1e7; }
    .wrap { padding: 24px; }
    .tag { display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      background: #1d1d1b; color: #f6f1e7; border-radius: 999px; padding: 4px 10px; }
    h1 { font-size: 30px; margin: 14px 0 6px; }
    p { margin: 0 0 16px; color: #74746c; }
    .code { display: inline-block; font-size: 26px; font-weight: 700; letter-spacing: .1em;
      border: 2px dashed #e4572e; color: #e4572e; border-radius: 10px; padding: 8px 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Watching from home</span>
    <h1>Don't miss a play</h1>
    <p>20% off team gear delivered before kickoff.</p>
    <div class="code">HOME20</div>
  </div>
</body>
</html>
