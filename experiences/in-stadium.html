<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>In-stadium welcome</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      font-family: -apple-system, system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at 30% 20%, #2f6df6, #0b1f4d 70%); }
    .wrap { padding: 24px; }
    .tag { display: inline-block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 4px 10px; }
    h1 { font-size: 30px; margin: 14px 0 6px; }
    p { margin: 0 0 16px; opacity: .85; }
    .seat { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">You're in the stadium</span>
    <h1>Welcome to game day</h1>
    <p>Show this screen at Gate C for a free drink.</p>
    <div class="seat">Section 114</div>
  </div>
  <script>alert('This script is removed on upload');</script>
</body>
</html>
