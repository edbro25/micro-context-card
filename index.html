<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Context Canvas</title>
  <style>
    :root {
      --bg: #f4f4f1; --dot: #d3d3cc; --ink: #1d1d1b; --muted: #74746c;
      --card: #ffffff; --line: #e2e2dc; --link: #cfcfc7; --accent: #2f6df6; --ok: #1f9d55;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overscroll-behavior: none; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }

    /* ---------- Canvas ---------- */
    #canvas { position: fixed; inset: 0; touch-action: none; cursor: grab; overflow: hidden; background: var(--bg);
      background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); }
    #canvas.dragging { cursor: grabbing; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #links path { fill: none; stroke: var(--link); stroke-width: 2; transition: stroke .5s, stroke-width .5s; }
    #links path.lit { stroke: var(--accent); stroke-width: 3.5; transition: none; }

    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
    .topbar > * { pointer-events: auto; }
    .topbar .actions { display: flex; gap: 8px; }
    .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
    .sync { display: inline-flex; align-items: center; gap: 6px; }
    .sync i { width: 8px; height: 8px; border-radius: 50%; background: #c4c4bc; }
    .sync.live i { background: var(--ok); }
    .sync.scan i { background: var(--accent); animation: blink 1s infinite; }
    @media (max-width: 440px) { .brand { display: none; } }
    .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

    /* ---------- Root context card ---------- */
    .card { position: absolute; width: 260px; transform: translate(-50%, -50%);
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
      overflow: hidden; transition: box-shadow .25s, border-color .25s; z-index: 1; }
    .card.seen { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(31,157,85,.25), 0 8px 24px rgba(0,0,0,.08); }
    .card-label { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card-title { margin: 2px 14px 10px; font-size: 17px; font-weight: 600; outline: none; border-radius: 6px; }
    .card-title:focus { box-shadow: 0 0 0 2px var(--accent); }
    .photo { position: relative; margin: 0 14px; aspect-ratio: 4 / 3; border-radius: 10px;
      background: #efefea; border: 1.5px dashed #cfcfc7; display: grid; place-items: center;
      overflow: hidden; color: var(--muted); font-size: 14px; }
    .photo.has-img { border: 0; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .progress { position: absolute; inset: auto 0 0 0; height: 4px; background: rgba(0,0,0,.08); }
    .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 14px; }
    .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c4bc; flex: none; }
    .dot.ready { background: var(--ok); }
    .dot.busy { background: var(--accent); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .btn { background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 500; }
    .btn:disabled { opacity: .35; cursor: default; }

    /* ---------- Metric branches ---------- */
    #tree { transition: opacity .4s; }
    #tree.empty { opacity: 0; pointer-events: none; }
    .branch, .metric { position: absolute; border-radius: 12px; }
    .branch { width: 206px; background: var(--ink); color: #fff; padding: 10px 12px; }
    .branch b { display: block; font-size: 14px; }
    .branch span { font-size: 11px; opacity: .7; }
    .metric { width: 182px; min-height: 80px; background: var(--card); border: 1px solid var(--line); padding: 8px 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .metric .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .metric .row { display: flex; align-items: baseline; gap: 6px; margin: 1px 0 2px; min-width: 0; }
    .metric .value { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .metric .detail { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric .proxy { font-size: 11px; color: var(--muted); line-height: 1.3; }
    .metric.pulse { animation: pulse .9s ease-out; }
    @keyframes pulse {
      0% { transform: scale(1.06); border-color: var(--accent); box-shadow: 0 0 0 6px rgba(47,109,246,.25); }
      100% { transform: scale(1); border-color: var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    }

    /* ---------- Viewfinder ---------- */
    #scanner { position: fixed; inset: 0; z-index: 20; background: #000; overflow: hidden; touch-action: manipulation; }
    #scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #flash { position: absolute; inset: 0; background: rgba(31,157,85,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
    #flash.on { opacity: 1; transition: none; }
    .guide { position: absolute; left: 50%; top: 50%; height: 50%; aspect-ratio: 1; transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.5); border-radius: 24px; transition: border-color .2s; pointer-events: none; }
    .guide.found { border-color: var(--ok); }
    .scan-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 12px 12px 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .scan-top button { background: rgba(0,0,0,.45); color: #fff; border-radius: 999px; padding: 8px 16px; text-shadow: none; }
    .scan-status { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100% - 24px);
      display: flex; align-items: center; gap: 10px; white-space: nowrap;
      background: rgba(0,0,0,.55); color: #fff; padding: 6px 14px 6px 6px; border-radius: 999px; font-size: 14px; }
    .scan-status img { width: 30px; height: 30px; object-fit: cover; border-radius: 8px; }
    .scan-status.found { background: var(--ok); }
    .rail { position: absolute; right: 10px; top: calc(60px + env(safe-area-inset-top)); bottom: calc(108px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .rail button { width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.45); font-size: 19px;
      display: grid; place-items: center; transition: opacity .2s, background .2s, transform .1s; }
    .rail button:active { transform: scale(.9); }
    .rail button.active { background: #fff; }
    .off .rail button, .off .cta { opacity: .4; }
    .cta { position: absolute; left: 12px; right: 64px; bottom: calc(56px + env(safe-area-inset-bottom));
      background: #fff; color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px;
      display: flex; justify-content: space-between; }
    .cta.active { background: var(--accent); color: #fff; }
    #commentBar { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; background: #fff; border-radius: 999px; padding: 4px 4px 4px 14px; z-index: 2; }
    #commentBar input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent; }
    #commentBar button { background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 14px; }
    .heart { position: absolute; font-size: 72px; transform: translate(-50%, -50%); pointer-events: none; animation: pop .8s ease-out forwards; }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(.4); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%,-90%) scale(1); opacity: 0; } }

    /* While scanning: camera and live canvas share the screen */
    body.scanning .topbar { display: none; }
    body.scanning #scanner { inset: 0 0 42% 0; }
    body.scanning #canvas { inset: 58% 0 0 0; border-top: 1px solid var(--line); }
    @media (min-aspect-ratio: 1/1) {
      body.scanning #scanner { inset: 0 50% 0 0; }
      body.scanning #canvas { inset: 0 0 0 50%; border-top: 0; border-left: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <!-- Full-page pan / zoom canvas -->
  <div id="canvas">
    <div id="world">
      <svg id="links" width="1" height="1"></svg>
      <div id="tree" class="empty"></div>
      <div class="card" id="card" style="left:0;top:0">
        <div class="card-label"><span>Context card · Step 1</span><span id="seenCount"></span></div>
        <div class="card-title" id="title" contenteditable="true" spellcheck="false">Untitled</div>
        <div class="photo" id="photo">
          <span id="photoHint">Tap to register a flat photo</span>
          <div class="progress" id="progress" hidden><i></i></div>
        </div>
        <div class="card-foot">
          <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">No photo registered</span></div>
          <button class="btn" id="scanBtn" disabled>Scan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="topbar">
    <div class="actions">
      <span class="pill brand">Context Canvas</span>
      <span class="pill sync" id="syncPill" hidden><i></i><span id="syncText">Connecting…</span></span>
    </div>
    <div class="actions">
      <button class="pill" id="resetBtn" hidden>Reset metrics</button>
      <button class="pill" id="recenter">Fit</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>

  <!-- Camera viewfinder -->
  <div id="scanner" class="off" hidden>
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>
    <div class="guide" id="guide"></div>
    <div class="scan-top">
      <span id="scanTitle"></span>
      <button id="closeScan">Done</button>
    </div>
    <div class="rail" id="rail">
      <button data-act="like" aria-label="Like">❤️</button>
      <button data-act="comment" aria-label="Comment">💬</button>
      <button data-act="save" aria-label="Save">🔖</button>
      <button data-act="share" aria-label="Share">📤</button>
      <button data-act="follow" aria-label="Follow">➕</button>
    </div>
    <button class="cta" data-act="tap" id="cta"><span>Learn more</span><span>›</span></button>
    <div class="scan-status" id="scanStatus"><img id="scanThumb" alt=""><span id="scanText">Starting camera…</span></div>
    <form id="commentBar" hidden>
      <input id="commentInput" placeholder="Add a comment…" autocomplete="off" enterkeyhint="send">
      <button type="submit">Post</button>
    </form>
  </div>

  <script type="module">
    const MINDAR_URL = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
    const STORE_KEY = 'contextCanvas.card.v1';
    const METRICS_KEY = 'contextCanvas.metrics.v1';
    const $ = (id) => document.getElementById(id);

    // Proxy thresholds
    const HOOK_MS = 1000;       // held in view this long = "stopped scrolling"
    const COMPLETE_MS = 6000;   // held in view this long = "watched to the end"
    const REWATCH_MS = 8000;    // back in view within this window = rewatch
    const GAP_MS = 700;         // brief tracking dropouts shorter than this don't end the impression
    const LEAN_RATIO = 0.75;    // camera moved ≥25% closer than at first sight = lean-in
    const LEAN_MS = 400;

    /* ================================================================
       ACTION HOOKS — step 2 goes here.
       onTriggerSeen fires once per impression (photo comes into view);
       onTriggerLost fires when that impression ends.
       ================================================================ */
    function onTriggerSeen(card, metrics) {
      console.log('[context-card] impression', metrics.impressions);
    }
    function onTriggerLost(card, metrics) {
      console.log('[context-card] impression ended');
    }

    /* ---------------- State & persistence ---------------- */
    const loadJSON = (key) => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } };
    const card = Object.assign({ title: 'Untitled', photo: null, photoId: null, target: null, seen: 0 }, loadJSON(STORE_KEY));
    const blankMetrics = () => ({ impressions: 0, views: 0, skips: 0, completed: 0, rewatches: 0, totalDwellMs: 0,
      maxDwellMs: 0, likes: 0, comments: 0, saves: 0, shares: 0, follows: 0, taps: 0, leanIns: 0, engaged: 0, lastComment: '' });
    const metrics = Object.assign(blankMetrics(), loadJSON(METRICS_KEY));

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(card)); }
      catch { try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...card, target: null })); } catch {} }
    }
    function saveMetrics() {
      try { localStorage.setItem(METRICS_KEY, JSON.stringify(metrics)); } catch {}
      pushMetrics();
    }

    /* ---------------- Metric definitions (the branches) ---------------- */
    const rate = (a, b) => (b ? a / b : 0);
    const pct = (x) => Math.round(x * 100) + '%';
    const sec = (ms) => (ms / 1000).toFixed(1) + 's';
    const ofImp = (n) => `${n} / ${metrics.impressions}`;

    const BRANCHES = [
      { id: 'attention', title: 'Attention', sub: 'Does it stop the scroll?', leaves: [
        { id: 'impressions', label: 'Impressions', value: (m) => String(m.impressions), detail: (m) => `${m.rewatches} rewatch`, proxy: 'Photo enters the frame' },
        { id: 'hook', label: 'Hook rate', value: (m) => pct(rate(m.views, m.impressions)), detail: (m) => ofImp(m.views), proxy: 'Held in view ≥ 1s' },
        { id: 'skip', label: 'Quick-skip rate', value: (m) => pct(rate(m.skips, m.impressions)), detail: (m) => ofImp(m.skips), proxy: 'Left view in under 1s' },
      ] },
      { id: 'retention', title: 'Retention', sub: 'How long do they watch?', leaves: [
        { id: 'watch', label: 'Avg watch time', value: (m) => sec(rate(m.totalDwellMs + liveDwell(), m.impressions)), detail: (m) => `max ${sec(Math.max(m.maxDwellMs, liveDwell()))}`, proxy: 'Time the photo stays tracked' },
        { id: 'completion', label: 'Completion rate', value: (m) => pct(rate(m.completed, m.impressions)), detail: (m) => ofImp(m.completed), proxy: 'Held in view ≥ 6s' },
        { id: 'rewatch', label: 'Rewatch rate', value: (m) => pct(rate(m.rewatches, m.impressions)), detail: (m) => ofImp(m.rewatches), proxy: 'Back in view within 8s' },
      ] },
      { id: 'engagement', title: 'Engagement', sub: 'Do they act on it?', leaves: [
        { id: 'likes', label: 'Likes', value: (m) => String(m.likes), proxy: 'Double-tap or ❤️' },
        { id: 'comments', label: 'Comments', value: (m) => String(m.comments), detail: (m) => (m.lastComment ? `“${m.lastComment}”` : ''), proxy: '💬 then Post' },
        { id: 'saves', label: 'Saves', value: (m) => String(m.saves), proxy: '🔖 — high-intent signal' },
        { id: 'shares', label: 'Shares', value: (m) => String(m.shares), proxy: '📤 — strongest reach signal' },
        { id: 'engRate', label: 'Engagement rate', value: (m) => pct(rate(m.engaged, m.impressions)), detail: (m) => `${m.likes + m.comments + m.saves + m.shares} actions`, proxy: 'Impressions with any ❤️ 💬 🔖 📤' },
      ] },
      { id: 'conversion', title: 'Conversion', sub: 'What advertisers pay for', leaves: [
        { id: 'follows', label: 'Follow rate', value: (m) => pct(rate(m.follows, m.impressions)), detail: (m) => ofImp(m.follows), proxy: '➕ Follow' },
        { id: 'ctr', label: 'Tap-through rate', value: (m) => pct(rate(m.taps, m.impressions)), detail: (m) => ofImp(m.taps), proxy: '“Learn more” taps' },
        { id: 'leanIn', label: 'Lean-in rate', value: (m) => pct(rate(m.leanIns, m.impressions)), detail: (m) => ofImp(m.leanIns), proxy: 'Camera moved ≥ 25% closer' },
      ] },
    ];
    const leafById = {};
    BRANCHES.forEach((b) => b.leaves.forEach((l) => { l.branch = b.id; leafById[l.id] = l; }));

    /* ---------------- Tree: build, lay out, render ---------------- */
    const tree = $('tree'), links = $('links'), cardEl = $('card');
    const COL_GAP = 230, BRANCH_Y = 250, SPINE_INSET = 12, LEAF_INDENT = 24, LEAF_GAP = 10;
    let bounds = { tree: null, root: null };

    function buildTree() {
      for (const b of BRANCHES) {
        b.el = Object.assign(document.createElement('div'), { className: 'branch' });
        b.el.innerHTML = `<b>${b.title}</b><span>${b.sub}</span>`;
        tree.append(b.el);
        for (const l of b.leaves) {
          l.el = Object.assign(document.createElement('div'), { className: 'metric' });
          l.el.innerHTML = `<div class="label">${l.label}</div><div class="row"><span class="value"></span><span class="detail"></span></div><div class="proxy">${l.proxy}</div>`;
          l.valueEl = l.el.querySelector('.value');
          l.detailEl = l.el.querySelector('.detail');
          tree.append(l.el);
        }
      }
    }

    function layout() {
      const place = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
      const rootBottom = cardEl.offsetHeight / 2;
      const midY = (rootBottom + BRANCH_Y) / 2;
      const paths = [];
      let maxY = BRANCH_Y;
      BRANCHES.forEach((b, i) => {
        const cx = (i - (BRANCHES.length - 1) / 2) * COL_GAP;
        const left = cx - 103;
        place(b.el, left, BRANCH_Y);
        const branchBottom = BRANCH_Y + b.el.offsetHeight;
        paths.push(`<path id="link-${b.id}" d="M0 ${rootBottom} V${midY} H${cx} V${BRANCH_Y}"/>`);
        const spineX = left + SPINE_INSET;
        let y = branchBottom + LEAF_GAP;
        for (const l of b.leaves) {
          place(l.el, left + LEAF_INDENT, y);
          const mid = y + l.el.offsetHeight / 2;
          paths.push(`<path id="link-${l.id}" d="M${spineX} ${branchBottom} V${mid} H${left + LEAF_INDENT}"/>`);
          y += l.el.offsetHeight + LEAF_GAP;
        }
        maxY = Math.max(maxY, y);
      });
      links.innerHTML = paths.join('');
      const halfW = ((BRANCHES.length - 1) / 2) * COL_GAP + 103;
      const top = -cardEl.offsetHeight / 2;
      bounds.tree = { x: -halfW, y: top, w: halfW * 2, h: maxY - top };
      bounds.root = { x: -cardEl.offsetWidth / 2, y: top, w: cardEl.offsetWidth, h: cardEl.offsetHeight };
    }

    const litTimers = {};
    function light(id) {
      const p = links.querySelector('#link-' + id);
      if (!p) return;
      p.classList.add('lit');
      clearTimeout(litTimers[id]);
      litTimers[id] = setTimeout(() => p.classList.remove('lit'), 250);
    }

    function renderMetrics(pulse = true) {
      for (const l of Object.values(leafById)) {
        const v = l.value(metrics), d = l.detail ? l.detail(metrics) : '';
        if (l.valueEl.textContent === v && l.detailEl.textContent === d) continue;
        l.valueEl.textContent = v;
        l.detailEl.textContent = d;
        if (pulse && l.rendered) {
          l.el.classList.remove('pulse');
          void l.el.offsetWidth;
          l.el.classList.add('pulse');
          light(l.branch);
          light(l.id);
        }
        l.rendered = true;
      }
      $('seenCount').textContent = metrics.impressions ? `Seen ${metrics.impressions}×` : '';
    }

    /* ---------------- Canvas pan & zoom ---------------- */
    const canvasEl = $('canvas'), world = $('world');
    const view = { x: 0, y: 0, k: 1 };
    const pointers = new Map();
    let pinch = null, moved = false, userPanned = false;

    function applyView() {
      world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
      const s = 22 * view.k;
      canvasEl.style.backgroundSize = `${s}px ${s}px`;
      canvasEl.style.backgroundPosition = `${view.x % s}px ${view.y % s}px`;
    }
    function localPoint(clientX, clientY) {
      const r = canvasEl.getBoundingClientRect();
      return [clientX - r.left, clientY - r.top];
    }
    function zoomAt(cx, cy, k) {
      k = Math.min(3, Math.max(0.2, k));
      view.x = cx - (cx - view.x) * (k / view.k);
      view.y = cy - (cy - view.y) * (k / view.k);
      view.k = k;
      applyView();
    }
    // Fit the whole tree once a photo is registered; otherwise just the card.
    function fit() {
      userPanned = false;
      const b = (card.target ? bounds.tree : bounds.root) || { x: -130, y: -150, w: 260, h: 300 };
      const scanning = document.body.classList.contains('scanning');
      const top = scanning ? 0 : 56;
      const cw = canvasEl.clientWidth, ch = canvasEl.clientHeight - top, pad = 32;
      const k = Math.max(0.2, Math.min(1, (cw - pad) / b.w, (ch - pad) / b.h));
      view.k = k;
      view.x = cw / 2 - (b.x + b.w / 2) * k;
      view.y = top + ch / 2 - (b.y + b.h / 2) * k;
      applyView();
    }

    canvasEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, input, [contenteditable]')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = false;
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
      }
      canvasEl.classList.add('dragging');
    });
    canvasEl.addEventListener('pointermove', (e) => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      // Capture only once a drag starts: capturing on pointerdown makes Chrome
      // retarget the click to the canvas, so taps on the card never register.
      if (!canvasEl.hasPointerCapture(e.pointerId)) canvasEl.setPointerCapture(e.pointerId);
      userPanned = true;
      p.x = e.clientX; p.y = e.clientY;
      if (pointers.size === 1) { view.x += dx; view.y += dy; applyView(); }
      else if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        zoomAt(...localPoint((a.x + b.x) / 2, (a.y + b.y) / 2), pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
      }
    });
    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvasEl.classList.remove('dragging');
    };
    canvasEl.addEventListener('pointerup', endPointer);
    canvasEl.addEventListener('pointercancel', endPointer);
    canvasEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      userPanned = true;
      if (e.ctrlKey || e.metaKey) zoomAt(...localPoint(e.clientX, e.clientY), view.k * Math.exp(-e.deltaY * 0.01));
      else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
    }, { passive: false });
    ['gesturestart', 'gesturechange'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
    $('recenter').onclick = fit;
    // Chrome's viewport often settles after load; keep things fitted until the user moves the canvas.
    addEventListener('resize', () => (userPanned ? applyView() : fit()));

    /* ---------------- Card UI ---------------- */
    function setStatus(text, state = '') {
      $('statusText').textContent = text;
      $('statusDot').className = 'dot ' + state;
    }
    function renderCard() {
      $('title').textContent = card.title;
      const photoEl = $('photo');
      photoEl.querySelector('img')?.remove();
      if (card.photo) {
        const img = new Image();
        img.src = card.photo;
        img.alt = 'Registered photo';
        photoEl.prepend(img);
      }
      photoEl.classList.toggle('has-img', !!card.photo);
      $('photoHint').hidden = !!card.photo;
      $('scanBtn').disabled = !card.target;
      tree.classList.toggle('empty', !card.target);
      links.style.display = card.target ? '' : 'none';
      $('resetBtn').hidden = !card.photo;
      if (!card.photo) setStatus('No photo registered');
      else if (card.target) setStatus('Photo registered', 'ready');
      else if (!registeringLocally) setStatus('Registering on another device…', 'busy');
    }

    $('title').addEventListener('input', () => {
      card.title = $('title').textContent.trim() || 'Untitled';
      save();
      put('title', { value: card.title, by: clientId });
    });
    $('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
    $('photo').addEventListener('click', () => { if (!moved) $('fileInput').click(); });
    $('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (file) await setTriggerPhoto(file);
    });
    // Resets the whole demo — photo, title and metrics — on every connected device.
    $('resetBtn').onclick = () => {
      if (!confirm('Reset everything (photo, title and metrics) on all devices?')) return;
      resetEverything();
    };
    function resetMetrics() {
      Object.assign(metrics, blankMetrics());
      card.seen = 0;
      save();
      saveMetrics();
      renderMetrics(false);
    }

    /* ---------------- Trigger photo → image target ---------------- */
    let mindar = null, registeringLocally = false;
    const loadMindAR = () => (mindar ??= import(MINDAR_URL));

    function fileToImage(file, maxSide = 1024) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    const bufToB64 = (buf) => {
      const bytes = new Uint8Array(buf); let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(s);
    };
    const b64ToBuf = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;

    async function setTriggerPhoto(file) {
      $('scanBtn').disabled = true;
      setStatus('Registering photo…', 'busy');
      const bar = $('progress');
      bar.hidden = false; bar.firstElementChild.style.width = '0%';
      registeringLocally = true;
      try {
        card.photo = await fileToImage(file);
        card.photoId = Date.now().toString(36) + clientId;
        card.target = null;
        put('photo', { data: card.photo, id: card.photoId, by: clientId });
        put('target', null);
        resetMetrics();
        renderCard();
        setStatus('Registering photo…', 'busy');
        const { Compiler } = await loadMindAR();
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = card.photo; });
        const compiler = new Compiler();
        await compiler.compileImageTargets([img], (p) => { bar.firstElementChild.style.width = p.toFixed(0) + '%'; });
        card.target = bufToB64(await compiler.exportData());
        save();
        put('target', { data: card.target, id: card.photoId, by: clientId });
        renderCard();
        if (!userPanned) fit();
      } catch (err) {
        console.error(err);
        setStatus('Could not register — try a more detailed photo', '');
      } finally {
        registeringLocally = false;
        bar.hidden = true;
      }
    }

    /* ---------------- Impression tracking (passive proxies) ---------------- */
    let imp = null, gapTimer = null, lastEndAt = 0, leanStart = null;
    // Local impression if this device is scanning, otherwise the other device's live watch time.
    const liveDwell = () => (imp ? (imp.lostAt ?? Date.now()) - imp.start : remoteLive?.inView ? remoteLive.dwellMs : 0);

    function onFound() {
      if (gapTimer) {                       // brief dropout: same impression continues
        clearTimeout(gapTimer); gapTimer = null;
        imp.lostAt = null;
        showFound(true, 'Photo detected');
        pushLive(true);
        return;
      }
      const now = Date.now();
      imp = { start: now, lostAt: null, baseZ: null, viewed: false, completed: false, leaned: false, actions: {} };
      metrics.impressions++;
      if (lastEndAt && now - lastEndAt <= REWATCH_MS) metrics.rewatches++;
      card.seen = metrics.impressions;
      save(); saveMetrics();
      renderMetrics();
      setRail(true);
      showFound(true, 'Photo detected');
      cardEl.classList.add('seen');
      const flash = $('flash');
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      navigator.vibrate?.(40);
      pushLive(true);
      onTriggerSeen(card, metrics);
    }

    function onLost() {
      if (!imp) return;
      imp.lostAt = Date.now();
      leanStart = null;
      showFound(false, 'Point at the registered photo');
      gapTimer = setTimeout(endImpression, GAP_MS);
      pushLive(true);
    }

    function endImpression() {
      clearTimeout(gapTimer); gapTimer = null;
      if (!imp) return;
      const end = imp.lostAt ?? Date.now();
      const dwell = end - imp.start;
      if (dwell < HOOK_MS) metrics.skips++;
      metrics.totalDwellMs += dwell;
      metrics.maxDwellMs = Math.max(metrics.maxDwellMs, dwell);
      lastEndAt = end;
      imp = null;
      saveMetrics();
      renderMetrics();
      setRail(false);
      cardEl.classList.remove('seen');
      pushLive(true);
      onTriggerLost(card, metrics);
    }

    function onFrame(m) {
      if (!imp || !m) return;
      const z = Math.abs(m[14]);
      if (!z) return;
      if (imp.baseZ == null) { imp.baseZ = z; return; }
      if (z < imp.baseZ * LEAN_RATIO) {
        leanStart ??= Date.now();
        if (!imp.leaned && Date.now() - leanStart >= LEAN_MS) {
          imp.leaned = true;
          metrics.leanIns++;
          saveMetrics();
          renderMetrics();
        }
      } else leanStart = null;
    }

    // Live ticker: hook/completion thresholds and watch time update while the photo is in view.
    setInterval(() => {
      if (!imp) return;
      const d = liveDwell();
      let changed = false;
      if (!imp.viewed && d >= HOOK_MS) { imp.viewed = true; metrics.views++; changed = true; }
      if (!imp.completed && d >= COMPLETE_MS) { imp.completed = true; metrics.completed++; changed = true; }
      if (changed) saveMetrics();
      renderMetrics(changed);
      pushLive();
    }, 200);

    /* ---------------- In-camera actions (active proxies) ---------------- */
    const ACTION_KEYS = { like: 'likes', save: 'saves', share: 'shares', follow: 'follows', tap: 'taps' };
    const ENGAGEMENT_ACTIONS = new Set(['like', 'comment', 'save', 'share']);
    function markEngaged(forImp, type) {
      if (!forImp || forImp.engaged || !ENGAGEMENT_ACTIONS.has(type)) return;
      forImp.engaged = true;
      metrics.engaged++;
    }
    const actionButtons = () => [...document.querySelectorAll('#scanner [data-act]')];

    function setRail(on) {
      $('scanner').classList.toggle('off', !on);
      if (on) actionButtons().forEach((b) => b.classList.remove('active'));
      if (!on) $('commentBar').hidden = true;
    }

    let nudgeTimer = null;
    function nudge() {
      $('scanText').textContent = 'Point at the photo first';
      clearTimeout(nudgeTimer);
      nudgeTimer = setTimeout(() => { if (!imp) $('scanText').textContent = 'Point at the registered photo'; }, 1200);
    }

    function act(type) {
      if (!imp) return nudge();
      if (type === 'comment') {
        $('commentBar').hidden = false;
        $('commentInput').focus();
        return;
      }
      if (imp.actions[type]) return;      // one of each per impression, like the real apps
      imp.actions[type] = true;
      actionButtons().filter((b) => b.dataset.act === type).forEach((b) => b.classList.add('active'));
      metrics[ACTION_KEYS[type]]++;
      markEngaged(imp, type);
      saveMetrics();
      renderMetrics();
    }

    actionButtons().forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); act(b.dataset.act); }));

    $('commentBar').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('commentInput').value.trim();
      $('commentInput').value = '';
      $('commentBar').hidden = true;
      $('commentInput').blur();
      if (!text) return;
      metrics.comments++;
      metrics.lastComment = text.slice(0, 60);
      markEngaged(imp, 'comment');
      saveMetrics();
      renderMetrics();
    });

    // Double-tap the viewfinder to like (with a heart burst).
    let lastTap = 0;
    $('scanner').addEventListener('pointerup', (e) => {
      if (e.target.closest('button, input, form')) return;
      const now = Date.now();
      if (now - lastTap < 320) {
        lastTap = 0;
        if (!imp) return nudge();
        const r = $('scanner').getBoundingClientRect();
        const heart = Object.assign(document.createElement('div'), { className: 'heart', textContent: '❤️' });
        heart.style.left = e.clientX - r.left + 'px';
        heart.style.top = e.clientY - r.top + 'px';
        $('scanner').append(heart);
        setTimeout(() => heart.remove(), 800);
        act('like');
      } else lastTap = now;
    });

    /* ---------------- Scanner ---------------- */
    const video = $('video');
    let stream = null, controller = null, visible = false;

    async function openScanner() {
      document.body.classList.add('scanning');
      $('scanner').hidden = false;
      pushLive(true);
      if (sync.on) sync.api.onDisconnect(roomRef('live')).remove();
      setRail(false);
      requestAnimationFrame(fit);
      $('scanTitle').textContent = card.title;
      $('scanThumb').src = card.photo;
      showFound(false, 'Starting camera…');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
        });
        video.srcObject = stream;
        await video.play();
        await new Promise((r) => (video.videoWidth ? r() : video.addEventListener('loadedmetadata', r, { once: true })));
        video.width = video.videoWidth;
        video.height = video.videoHeight;

        showFound(false, 'Loading detector…');
        const { Controller } = await loadMindAR();
        controller = new Controller({
          inputWidth: video.videoWidth,
          inputHeight: video.videoHeight,
          maxTrack: 1,
          onUpdate: ({ type, worldMatrix }) => {
            if (type !== 'updateMatrix') return;
            if (worldMatrix) {
              if (!visible) { visible = true; onFound(); }
              onFrame(worldMatrix);
            } else if (visible) { visible = false; onLost(); }
          },
        });
        controller.addImageTargetsFromBuffer(b64ToBuf(card.target));
        await controller.dummyRun(video);
        controller.processVideo(video);
        showFound(false, 'Point at the registered photo');
      } catch (err) {
        console.error(err);
        showFound(false, err.name === 'NotAllowedError' ? 'Camera permission denied' : 'Camera unavailable');
      }
    }

    function closeScanner() {
      controller?.stopProcessVideo();
      controller = null;
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      visible = false;
      if (imp) { imp.lostAt ??= Date.now(); endImpression(); }
      $('scanner').hidden = true;
      document.body.classList.remove('scanning');
      pushLive(true);
      requestAnimationFrame(fit);
    }

    function showFound(found, text) {
      $('scanStatus').classList.toggle('found', found);
      $('guide').classList.toggle('found', found);
      $('scanText').textContent = text;
    }

    $('scanBtn').onclick = openScanner;
    $('closeScan').onclick = closeScanner;
    document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeScanner(); });

    /* ---------------- Live sync across devices (Firebase Realtime Database) ---------------- */
    // Firebase web config (public by design; access is governed by database rules). Set to null to run on this device only.
    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyDNDSi6Ep3TDbELk5VHtya1p8jbCDMFW98',
      authDomain: 'context-canvas-5b0b4.firebaseapp.com',
      databaseURL: 'https://context-canvas-5b0b4-default-rtdb.firebaseio.com',
      projectId: 'context-canvas-5b0b4',
      storageBucket: 'context-canvas-5b0b4.firebasestorage.app',
      messagingSenderId: '974150159084',
      appId: '1:974150159084:web:5c25ab182da8dc2bedb3c9',
    };
    const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
    const ROOM = 'default';
    const clientId = Math.random().toString(36).slice(2, 10);
    const sync = { on: false, api: null, db: null, connected: false };
    let remoteLive = null, lastTarget = null, firstMetrics = true, metricsPushTimer = null, livePushAt = 0;

    function roomRef(path) {
      return sync.api.ref(sync.db, `demos/${ROOM}${path ? '/' + path : ''}`);
    }
    function put(path, value) {
      if (sync.on) sync.api.set(roomRef(path), value).catch((err) => console.error('[sync]', err));
    }
    function pushMetrics() {
      if (!sync.on) return;
      clearTimeout(metricsPushTimer);
      metricsPushTimer = setTimeout(() => put('metrics', { ...metrics, by: clientId }), 120);
    }
    function pushLive(force = false) {
      if (!sync.on) return;
      const now = Date.now();
      if (!force && now - livePushAt < 500) return;
      livePushAt = now;
      put('live', {
        scanning: document.body.classList.contains('scanning'),
        inView: !!imp && !imp.lostAt,
        dwellMs: imp ? liveDwell() : 0,
        by: clientId,
      });
    }

    function updateSyncPill() {
      $('syncPill').hidden = !FIREBASE_CONFIG;
      $('syncPill').classList.toggle('live', sync.connected);
      $('syncPill').classList.toggle('scan', sync.connected && !!remoteLive?.scanning);
      $('syncText').textContent = !sync.on ? 'Connecting…'
        : !sync.connected ? 'Offline'
        : remoteLive?.inView ? 'Live · photo in view'
        : remoteLive?.scanning ? 'Live · scanning'
        : 'Live';
    }

    // Clear this device only (no writes) — used for both local and remote resets.
    function wipeLocal() {
      clearTimeout(gapTimer); gapTimer = null; imp = null;
      if (!$('scanner').hidden) closeScanner();
      Object.assign(card, { title: 'Untitled', photo: null, photoId: null, target: null, seen: 0 });
      Object.assign(metrics, blankMetrics());
      lastTarget = null;
      try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(METRICS_KEY); } catch {}
      cardEl.classList.remove('seen');
      renderCard();
      renderMetrics(false);
      fit();
    }
    function resetEverything() {
      wipeLocal();
      if (sync.on) sync.api.remove(roomRef()).catch((err) => console.error('[sync]', err));
    }

    function applyTitle(v) {
      if (v?.by === clientId) return;
      card.title = v?.value || 'Untitled';
      save();
      if (document.activeElement !== $('title')) $('title').textContent = card.title;
    }
    function applyPhoto(v) {
      if (!v) { if (card.photo) wipeLocal(); return; }   // demo was reset
      if (v.id === card.photoId) return;
      Object.assign(card, { photo: v.data, photoId: v.id, target: lastTarget?.id === v.id ? lastTarget.data : null });
      save();
      renderCard();
      if (!userPanned) fit();
    }
    function applyTarget(v) {
      lastTarget = v;
      if (!v || v.id !== card.photoId || card.target === v.data) return;
      card.target = v.data;
      save();
      renderCard();
      if (!userPanned) fit();
    }
    function applyMetrics(v) {
      if (v?.by === clientId) { firstMetrics = false; return; }
      const next = Object.assign(blankMetrics(), v || {});
      delete next.by;
      Object.assign(metrics, next);
      card.seen = metrics.impressions;
      try { localStorage.setItem(METRICS_KEY, JSON.stringify(metrics)); } catch {}
      renderMetrics(!firstMetrics);
      firstMetrics = false;
    }
    function applyLive(v) {
      remoteLive = v && v.by !== clientId ? v : null;
      if (!imp) cardEl.classList.toggle('seen', !!remoteLive?.inView);
      updateSyncPill();
      renderMetrics(false);
    }

    async function startSync() {
      if (!FIREBASE_CONFIG) return;
      updateSyncPill();
      try {
        const [{ initializeApp }, api] = await Promise.all([
          import(FIREBASE_SDK + 'firebase-app.js'),
          import(FIREBASE_SDK + 'firebase-database.js'),
        ]);
        sync.api = api;
        sync.db = api.getDatabase(initializeApp(FIREBASE_CONFIG));
        sync.on = true;
        api.onValue(api.ref(sync.db, '.info/connected'), (s) => { sync.connected = !!s.val(); updateSyncPill(); });
        api.onValue(roomRef('title'), (s) => applyTitle(s.val()));
        api.onValue(roomRef('target'), (s) => applyTarget(s.val()));
        api.onValue(roomRef('photo'), (s) => applyPhoto(s.val()));
        api.onValue(roomRef('metrics'), (s) => applyMetrics(s.val()));
        api.onValue(roomRef('live'), (s) => applyLive(s.val()));
        updateSyncPill();
      } catch (err) {
        console.error('[sync]', err);
        $('syncText').textContent = 'Sync failed';
      }
    }

    // Exposed for testing and for wiring step 2 from the console.
    window.contextCanvas = { card, metrics, sync, loadMindAR, b64ToBuf, onFound, onLost, onFrame, act, endImpression, openScanner, closeScanner, fit, resetEverything };

    buildTree();
    renderCard();
    renderMetrics(false);
    layout();
    fit();
    document.fonts?.ready.then(() => { layout(); if (!userPanned) fit(); });
    startSync();
  </script>
</body>
</html>
