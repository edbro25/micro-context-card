<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Context Canvas</title>
  <style>
    :root {
      --bg: #f4f4f1; --dot: #d3d3cc; --ink: #1d1d1b; --muted: #74746c;
      --card: #ffffff; --line: #e2e2dc; --link: #cfcfc7; --accent: #2f6df6; --ok: #1f9d55;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overscroll-behavior: none; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }

    /* ---------- Canvas ---------- */
    #canvas { position: fixed; inset: 0; touch-action: none; cursor: grab; overflow: hidden; background: var(--bg);
      background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); }
    #canvas.dragging { cursor: grabbing; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #links path { fill: none; stroke: #b9b9b1; stroke-width: 1.5; stroke-dasharray: 1.5 5; stroke-linecap: round; transition: stroke .6s; }
    #links path.lit { stroke: var(--accent); transition: none; }
    #links circle { fill: #9a9a92; }

    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
    .topbar > * { pointer-events: auto; }
    .topbar .actions { display: flex; gap: 8px; }
    .brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
    .sync { display: inline-flex; align-items: center; gap: 6px; }
    .sync i { width: 8px; height: 8px; border-radius: 50%; background: #c4c4bc; }
    .sync.live i { background: var(--ok); }
    .sync.scan i { background: var(--accent); animation: blink 1s infinite; }
    @media (max-width: 440px) { .brand { display: none; } }
    .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 14px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

    /* ---------- Root context card ---------- */
    .card { position: absolute; width: 260px; transform: translate(-50%, -50%);
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
      overflow: hidden; transition: box-shadow .25s, border-color .25s; z-index: 1; }
    .card.seen { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(31,157,85,.25), 0 8px 24px rgba(0,0,0,.08); }
    .card-label { display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card-title { margin: 2px 14px 10px; font-size: 17px; font-weight: 600; outline: none; border-radius: 6px; }
    .card-title:focus { box-shadow: 0 0 0 2px var(--accent); }
    .photo { position: relative; margin: 0 14px; aspect-ratio: 4 / 3; border-radius: 10px;
      background: #efefea; border: 1.5px dashed #cfcfc7; display: grid; place-items: center;
      overflow: hidden; color: var(--muted); font-size: 14px; }
    .photo.has-img { border: 0; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .progress { position: absolute; inset: auto 0 0 0; height: 4px; background: rgba(0,0,0,.08); }
    .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 14px; }
    .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c4bc; flex: none; }
    .dot.ready { background: var(--ok); }
    .dot.busy { background: var(--accent); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .3; } }
    .btn { background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 500; }
    .btn:disabled { opacity: .35; cursor: default; }

    /* ---------- Statistics spoke (left of the card) ---------- */
    #tree { transition: opacity .4s; }
    #tree.empty { opacity: 0; pointer-events: none; }
    .spoke-label { position: absolute; font-size: 13px; color: var(--muted); white-space: nowrap; transform: translateY(-50%); }
    .stats { position: absolute; display: grid; grid-template-columns: repeat(2, 148px); column-gap: 28px; row-gap: 16px; align-items: start; }
    .stat-group h4 { margin: 0 0 3px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a3a39b; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 0;
      font-size: 12.5px; color: var(--muted); cursor: default; }
    .stat b { font-weight: 560; color: var(--ink); font-variant-numeric: tabular-nums; transition: color .8s; }
    .stat.pulse b { color: var(--accent); transition: none; }

    /* ---------- Experiences spoke (right of the card) ---------- */
    .exp-list { position: absolute; width: 250px; font-size: 12.5px; }
    .exp-head { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .exp-play { width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1px solid #cfcfc7; background: transparent;
      display: grid; place-items: center; font-size: 8px; color: var(--ink); flex: none; }
    .exp-play.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    .exp-title { flex: 1; min-width: 0; text-align: left; background: none; padding: 2px 0; font-size: 12.5px; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .exp-title.paused { color: var(--muted); }
    .exp-now { font-size: 10.5px; color: var(--ok); white-space: nowrap; }
    .exp-details { margin: 2px 0 10px 30px; font-size: 11.5px; line-height: 1.55; }
    .exp-details dt { float: left; width: 46px; color: #a3a39b; }
    .exp-details dd { margin: 0 0 0 46px; color: var(--ink); white-space: pre-line; }
    .exp-preview { margin: 6px 0 2px; width: 200px; height: 120px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
    .exp-preview iframe { width: 400px; height: 240px; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; }
    .exp-link { background: none; padding: 4px 0; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
    .exp-empty { color: #a3a39b; font-size: 12px; padding: 2px 0 4px; }

    /* ---------- Schedule spoke (above the card) ---------- */
    .sched { position: absolute; width: 320px; text-align: center; font-size: 12.5px; color: var(--muted); }
    .sched-dates { color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
    .sched-bar { width: 180px; height: 2px; margin: 7px auto 5px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .sched-bar i { display: block; height: 100%; background: var(--ink); }
    .sched-meta { font-size: 11.5px; }
    .sched-form { display: grid; gap: 6px; justify-items: center; }
    .sched-inputs { display: flex; gap: 8px; }
    .sched-inputs label { display: grid; gap: 2px; font-size: 11px; color: #a3a39b; text-align: left; }
    .sched-inputs input { font: inherit; font-size: 16px; color: var(--ink); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .sched-actions { display: flex; align-items: center; gap: 12px; }
    .sched-error { color: #c0392b; font-size: 11.5px; }
    .btn.sm { padding: 5px 12px; font-size: 12.5px; }

    /* ---------- Ledger spoke (top-left of the card) ---------- */
    .ledger { position: absolute; width: 250px; font-size: 12.5px; color: var(--muted); }
    .ledger-sum { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; margin-bottom: 5px; }
    .ledger-sum.done .status { color: var(--ok); }
    .ledger-sum.over { color: #c0392b; }
    .ledger-bar { display: flex; gap: 1px; height: 3px; margin-bottom: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .ledger-bar i { display: block; height: 100%; }
    .ledger-row { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; cursor: default; }
    .ledger-row .name { flex: 1; min-width: 0; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ledger-row .role { font-size: 10.5px; color: #a3a39b; }
    .ledger-row.fee .name { color: var(--muted); }
    .ledger-row b { font-weight: 560; color: var(--ink); font-variant-numeric: tabular-nums; }
    .ledger-row .rm { width: 14px; padding: 0; background: none; color: #b9b9b1; font-size: 12px; line-height: 1; }
    .ledger-row .rm:hover { color: #c0392b; }
    .ledger-row .rm-space { width: 14px; }
    .ledger-form { display: grid; grid-template-columns: 1fr 76px; gap: 6px; margin-top: 6px; }
    .ledger-form input { font: inherit; font-size: 16px; color: var(--ink); padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
      background: #fff; min-width: 0; width: 100%; }
    .ledger-form .sched-error, .ledger-form .sched-actions { grid-column: 1 / -1; }

    /* ---------- Dashboard spoke (bottom-right of the card): setup checklist ---------- */
    .dash { position: absolute; width: 210px; font-size: 12.5px; color: var(--muted); }
    .dash-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; margin-bottom: 6px; }
    .dash-head.ready .status { color: var(--ok); }
    .check { display: flex; align-items: flex-start; gap: 8px; width: 100%; padding: 3px 0; background: none; text-align: left;
      font-size: 12.5px; color: var(--ink); }
    button.check:hover .check-label { text-decoration: underline; text-underline-offset: 2px; }
    .check i { flex: none; display: grid; place-items: center; width: 12px; height: 12px; margin-top: 2px; border-radius: 50%;
      border: 1px solid #b9b9b1; font-style: normal; font-size: 8px; line-height: 1; color: #fff; }
    .check.done i { background: var(--ok); border-color: var(--ok); }
    .check.done .check-label { color: var(--muted); }
    .check small { display: block; font-size: 11px; color: #a3a39b; }
    .dash-note { margin-top: 8px; font-size: 11.5px; }

    /* ---------- Add-experience drawer (sidebar on desktop, pop-out on mobile) ---------- */
    #drawerScrim { position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.18); }
    #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); z-index: 30; background: var(--card);
      border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.08); display: flex; flex-direction: column;
      transform: translateX(105%); transition: transform .28s ease; visibility: hidden; }
    #drawer.open { transform: none; visibility: visible; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
    .drawer-head b { font-size: 15px; }
    .drawer-body { margin: 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; display: grid; gap: 14px; align-content: start; }
    .drop { border: 1.5px dashed #cfcfc7; border-radius: 10px; padding: 20px 12px; text-align: center; color: var(--muted);
      font-size: 13px; cursor: pointer; background: #fafaf8; }
    .drop.over { border-color: var(--accent); background: rgba(47,109,246,.05); color: var(--accent); }
    .drop.has-file { padding: 8px; text-align: left; }
    .drop small { font-size: 12px; }
    .drop .file-name { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drop iframe { display: block; width: 100%; height: 150px; margin-top: 6px; border: 0; border-radius: 6px; background: #fff; pointer-events: none; }
    .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
    .field input { font: inherit; font-size: 16px; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; width: 100%; min-width: 0; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .drawer-body fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 12px; margin: 0; display: grid; gap: 8px; min-width: 0; }
    .drawer-body legend { font-size: 13px; color: var(--ink); padding: 0 4px; }
    .drawer-body legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .drawer-body fieldset:not(.on) > :not(legend) { display: none; }
    .form-error { color: #c0392b; font-size: 12px; min-height: 1em; }
    .drawer-body .btn { justify-self: start; }

    /* ---------- Viewfinder ---------- */
    #scanner { position: fixed; inset: 0; z-index: 20; background: #000; overflow: hidden; touch-action: manipulation; }
    #scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #flash { position: absolute; inset: 0; background: rgba(31,157,85,.35); opacity: 0; pointer-events: none; transition: opacity .4s; }
    #flash.on { opacity: 1; transition: none; }
    .guide { position: absolute; left: 50%; top: 50%; height: 50%; aspect-ratio: 1; transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.5); border-radius: 24px; transition: border-color .2s; pointer-events: none; }
    .guide.found { border-color: var(--ok); }
    .scan-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 12px 12px 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
    .scan-top button { background: rgba(0,0,0,.45); color: #fff; border-radius: 999px; padding: 8px 16px; text-shadow: none; }
    .scan-status { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: calc(100% - 24px);
      display: flex; align-items: center; gap: 10px; white-space: nowrap;
      background: rgba(0,0,0,.55); color: #fff; padding: 6px 14px 6px 6px; border-radius: 999px; font-size: 14px; }
    .scan-status img { width: 30px; height: 30px; object-fit: cover; border-radius: 8px; }
    .scan-status.found { background: var(--ok); }
    .rail { position: absolute; right: 10px; top: calc(60px + env(safe-area-inset-top)); bottom: calc(108px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .rail button { width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.45); font-size: 19px;
      display: grid; place-items: center; transition: opacity .2s, background .2s, transform .1s; }
    .rail button:active { transform: scale(.9); }
    .rail button.active { background: #fff; }
    .off .rail button, .off .cta { opacity: .4; }
    .cta { position: absolute; left: 12px; right: 64px; bottom: calc(56px + env(safe-area-inset-bottom));
      background: #fff; color: var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 14px;
      display: flex; justify-content: space-between; }
    .cta.active { background: var(--accent); color: #fff; }
    #commentBar { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; background: #fff; border-radius: 999px; padding: 4px 4px 4px 14px; z-index: 2; }
    #commentBar input { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent; }
    #commentBar button { background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 14px; }
    .heart { position: absolute; font-size: 72px; transform: translate(-50%, -50%); pointer-events: none; animation: pop .8s ease-out forwards; }
    @keyframes pop { 0% { transform: translate(-50%,-50%) scale(.4); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%,-90%) scale(1); opacity: 0; } }

    #expOverlay { position: absolute; left: 12px; right: 64px; top: calc(60px + env(safe-area-inset-top)); bottom: calc(108px + env(safe-area-inset-bottom));
      background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.35); animation: expIn .3s ease-out; }
    #expOverlay iframe { display: block; width: 100%; height: 100%; border: 0; }
    #expOverlay .exp-close { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,.55); color: #fff; font-size: 13px; }
    @keyframes expIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    .loc-chip { margin-left: 8px; font-size: 12px; opacity: .9; }

    /* While scanning: camera and live canvas share the screen */
    body.scanning .topbar { display: none; }
    body.scanning #scanner { inset: 0 0 42% 0; }
    body.scanning #canvas { inset: 58% 0 0 0; border-top: 1px solid var(--line); }
    @media (min-aspect-ratio: 1/1) {
      body.scanning #scanner { inset: 0 50% 0 0; }
      body.scanning #canvas { inset: 0 0 0 50%; border-top: 0; border-left: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <!-- Full-page pan / zoom canvas -->
  <div id="canvas">
    <div id="world">
      <svg id="links" width="1" height="1"></svg>
      <div id="tree" class="empty"></div>
      <div class="card" id="card" style="left:0;top:0">
        <div class="card-label"><span>Context card · Step 1</span><span id="seenCount"></span></div>
        <div class="card-title" id="title" contenteditable="true" spellcheck="false">Untitled</div>
        <div class="photo" id="photo">
          <span id="photoHint">Tap to register a flat photo</span>
          <div class="progress" id="progress" hidden><i></i></div>
        </div>
        <div class="card-foot">
          <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">No photo registered</span></div>
          <button class="btn" id="scanBtn" disabled>Scan</button>
        </div>
      </div>
    </div>
  </div>

  <div class="topbar">
    <div class="actions">
      <span class="pill brand">Context Canvas</span>
      <span class="pill sync" id="syncPill" hidden><i></i><span id="syncText">Connecting…</span></span>
    </div>
    <div class="actions">
      <button class="pill" id="resetBtn" hidden>Reset metrics</button>
      <button class="pill" id="recenter">Fit</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>

  <!-- Add experience: right sidebar on desktop, pop-out on mobile -->
  <div id="drawerScrim" hidden></div>
  <aside id="drawer" aria-label="New experience" aria-hidden="true">
    <div class="drawer-head"><b>New experience</b><button class="pill" id="drawerClose" type="button">Close</button></div>
    <form class="drawer-body" id="expForm" novalidate>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose an HTML file">
        <div id="dropText">Drop an HTML file here<br><small>or tap to choose · JavaScript is removed</small></div>
      </div>
      <input type="file" id="htmlInput" accept=".html,.htm,text/html" hidden>
      <label class="field">Title<input id="expTitle" placeholder="e.g. In-stadium welcome" maxlength="80" autocomplete="off"></label>
      <fieldset id="locSet">
        <legend><label><input type="checkbox" id="useLoc"> Location</label></legend>
        <div class="row2">
          <label class="field">Latitude<input id="expLat" placeholder="40.8135" autocomplete="off"></label>
          <label class="field">Longitude<input id="expLng" placeholder="-74.0745" autocomplete="off"></label>
        </div>
        <div class="row2">
          <label class="field">Radius (m)<input id="expRadius" value="200" autocomplete="off"></label>
          <button class="pill" id="useHere" type="button" style="align-self:end">Use my location</button>
        </div>
      </fieldset>
      <fieldset id="dateSet">
        <legend><label><input type="checkbox" id="useDates"> Date range</label></legend>
        <label class="field">Start<input type="datetime-local" id="expStart"></label>
        <label class="field">End<input type="datetime-local" id="expEnd"></label>
      </fieldset>
      <div class="form-error" id="expError"></div>
      <button class="btn" type="submit">Save experience</button>
    </form>
  </aside>

  <!-- Camera viewfinder -->
  <div id="scanner" class="off" hidden>
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>
    <div class="guide" id="guide"></div>
    <div id="expOverlay" hidden>
      <iframe sandbox="" title="Experience"></iframe>
      <button class="exp-close" id="expClose" aria-label="Close experience">✕</button>
    </div>
    <div class="scan-top">
      <span><span id="scanTitle"></span><span class="loc-chip" id="locChip"></span></span>
      <button id="closeScan">Done</button>
    </div>
    <div class="rail" id="rail">
      <button data-act="like" aria-label="Like">❤️</button>
      <button data-act="comment" aria-label="Comment">💬</button>
      <button data-act="save" aria-label="Save">🔖</button>
      <button data-act="share" aria-label="Share">📤</button>
      <button data-act="follow" aria-label="Follow">➕</button>
    </div>
    <button class="cta" data-act="tap" id="cta"><span>Learn more</span><span>›</span></button>
    <div class="scan-status" id="scanStatus"><img id="scanThumb" alt=""><span id="scanText">Starting camera…</span></div>
    <form id="commentBar" hidden>
      <input id="commentInput" placeholder="Add a comment…" autocomplete="off" enterkeyhint="send">
      <button type="submit">Post</button>
    </form>
  </div>

  <script type="module">
    const MINDAR_URL = 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
    const STORE_KEY = 'contextCanvas.card.v1';
    const METRICS_KEY = 'contextCanvas.metrics.v1';
    const $ = (id) => document.getElementById(id);

    // Proxy thresholds
    const HOOK_MS = 1000;       // held in view this long = "stopped scrolling"
    const COMPLETE_MS = 6000;   // held in view this long = "watched to the end"
    const REWATCH_MS = 8000;    // back in view within this window = rewatch
    const GAP_MS = 700;         // brief tracking dropouts shorter than this don't end the impression
    const LEAN_RATIO = 0.75;    // camera moved ≥25% closer than at first sight = lean-in
    const LEAN_MS = 400;

    /* ================================================================
       ACTION HOOKS — step 2 goes here.
       onTriggerSeen fires once per impression (photo comes into view);
       onTriggerLost fires when that impression ends.
       ================================================================ */
    function onTriggerSeen(card, metrics) {
      console.log('[context-card] impression', metrics.impressions);
    }
    function onTriggerLost(card, metrics) {
      console.log('[context-card] impression ended');
    }

    /* ---------------- State & persistence ---------------- */
    const loadJSON = (key) => { try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; } };
    const card = Object.assign({ title: 'Untitled', photo: null, photoId: null, target: null, seen: 0 }, loadJSON(STORE_KEY));
    const blankMetrics = () => ({ impressions: 0, views: 0, skips: 0, completed: 0, rewatches: 0, totalDwellMs: 0,
      maxDwellMs: 0, likes: 0, comments: 0, saves: 0, shares: 0, follows: 0, taps: 0, leanIns: 0, engaged: 0, lastComment: '' });
    const metrics = Object.assign(blankMetrics(), loadJSON(METRICS_KEY));

    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(card)); }
      catch { try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...card, target: null })); } catch {} }
    }
    function saveMetrics() {
      try { localStorage.setItem(METRICS_KEY, JSON.stringify(metrics)); } catch {}
      pushMetrics();
    }

    /* ---------------- Metric definitions (the branches) ---------------- */
    const rate = (a, b) => (b ? a / b : 0);
    const pct = (x) => Math.round(x * 100) + '%';
    const sec = (ms) => (ms / 1000).toFixed(1) + 's';
    const ofImp = (n) => `${n} / ${metrics.impressions}`;

    const BRANCHES = [
      { id: 'attention', title: 'Attention', sub: 'Does it stop the scroll?', leaves: [
        { id: 'impressions', label: 'Impressions', value: (m) => String(m.impressions), detail: (m) => `${m.rewatches} rewatch`, proxy: 'Photo enters the frame' },
        { id: 'hook', label: 'Hook rate', value: (m) => pct(rate(m.views, m.impressions)), detail: (m) => ofImp(m.views), proxy: 'Held in view ≥ 1s' },
        { id: 'skip', label: 'Quick-skip rate', value: (m) => pct(rate(m.skips, m.impressions)), detail: (m) => ofImp(m.skips), proxy: 'Left view in under 1s' },
      ] },
      { id: 'retention', title: 'Retention', sub: 'How long do they watch?', leaves: [
        { id: 'watch', label: 'Avg watch time', value: (m) => sec(rate(m.totalDwellMs + liveDwell(), m.impressions)), detail: (m) => `max ${sec(Math.max(m.maxDwellMs, liveDwell()))}`, proxy: 'Time the photo stays tracked' },
        { id: 'completion', label: 'Completion rate', value: (m) => pct(rate(m.completed, m.impressions)), detail: (m) => ofImp(m.completed), proxy: 'Held in view ≥ 6s' },
        { id: 'rewatch', label: 'Rewatch rate', value: (m) => pct(rate(m.rewatches, m.impressions)), detail: (m) => ofImp(m.rewatches), proxy: 'Back in view within 8s' },
      ] },
      { id: 'engagement', title: 'Engagement', sub: 'Do they act on it?', leaves: [
        { id: 'likes', label: 'Likes', value: (m) => String(m.likes), proxy: 'Double-tap or ❤️' },
        { id: 'comments', label: 'Comments', value: (m) => String(m.comments), detail: (m) => (m.lastComment ? `“${m.lastComment}”` : ''), proxy: '💬 then Post' },
        { id: 'saves', label: 'Saves', value: (m) => String(m.saves), proxy: '🔖 — high-intent signal' },
        { id: 'shares', label: 'Shares', value: (m) => String(m.shares), proxy: '📤 — strongest reach signal' },
        { id: 'engRate', label: 'Engagement rate', value: (m) => pct(rate(m.engaged, m.impressions)), detail: (m) => `${m.likes + m.comments + m.saves + m.shares} actions`, proxy: 'Impressions with any ❤️ 💬 🔖 📤' },
      ] },
      { id: 'conversion', title: 'Conversion', sub: 'What advertisers pay for', leaves: [
        { id: 'follows', label: 'Follow rate', value: (m) => pct(rate(m.follows, m.impressions)), detail: (m) => ofImp(m.follows), proxy: '➕ Follow' },
        { id: 'ctr', label: 'Tap-through rate', value: (m) => pct(rate(m.taps, m.impressions)), detail: (m) => ofImp(m.taps), proxy: '“Learn more” taps' },
        { id: 'leanIn', label: 'Lean-in rate', value: (m) => pct(rate(m.leanIns, m.impressions)), detail: (m) => ofImp(m.leanIns), proxy: 'Camera moved ≥ 25% closer' },
      ] },
    ];
    const leafById = {};
    BRANCHES.forEach((b) => b.leaves.forEach((l) => { l.branch = b.id; leafById[l.id] = l; }));

    /* ---------------- Statistics spoke: build, lay out, render ---------------- */
    const tree = $('tree'), links = $('links'), cardEl = $('card');
    const SPOKE_GAP = 14, SPOKE_LEN = 110, TOP_SPOKE_LEN = 56, DIAG_SPOKE_LEN = 72, LABEL_GAP = 10, STATS_GAP = 28;
    let bounds = { tree: null, root: null };
    let statsEl, spokeLabel, expLabel, expList, schedLabel, schedEl, ledgerLabel, ledgerEl, dashLabel, dashEl;

    function buildTree() {
      spokeLabel = Object.assign(document.createElement('div'), { className: 'spoke-label', textContent: 'Statistics' });
      statsEl = Object.assign(document.createElement('div'), { className: 'stats' });
      for (const b of BRANCHES) {
        const group = Object.assign(document.createElement('div'), { className: 'stat-group' });
        group.innerHTML = `<h4 title="${b.sub}">${b.title}</h4>`;
        for (const l of b.leaves) {
          l.el = Object.assign(document.createElement('div'), { className: 'stat', title: l.proxy });
          l.el.innerHTML = `<span>${l.label}</span><b></b>`;
          l.valueEl = l.el.querySelector('b');
          group.append(l.el);
        }
        statsEl.append(group);
      }
      expLabel = Object.assign(document.createElement('div'), { className: 'spoke-label', textContent: 'Experiences' });
      expList = Object.assign(document.createElement('div'), { className: 'exp-list' });
      schedLabel = Object.assign(document.createElement('div'), { className: 'spoke-label', textContent: 'Schedule' });
      schedEl = Object.assign(document.createElement('div'), { className: 'sched' });
      ledgerLabel = Object.assign(document.createElement('div'), { className: 'spoke-label', textContent: 'Ledger' });
      ledgerEl = Object.assign(document.createElement('div'), { className: 'ledger' });
      dashLabel = Object.assign(document.createElement('div'), { className: 'spoke-label', textContent: 'Dashboard' });
      dashEl = Object.assign(document.createElement('div'), { className: 'dash' });
      tree.append(spokeLabel, statsEl, expLabel, expList, schedLabel, schedEl, ledgerLabel, ledgerEl, dashLabel, dashEl);
    }

    // Spokes from the card: Ledger top-left, Schedule above, Statistics left, Experiences right, Dashboard bottom-right.
    function layout() {
      const cardLeft = -cardEl.offsetWidth / 2, cardTop = -cardEl.offsetHeight / 2;
      const lineStart = cardLeft - SPOKE_GAP, dotX = lineStart - SPOKE_LEN;
      const rStart = -cardLeft + SPOKE_GAP, rDot = rStart + SPOKE_LEN;
      const tStart = cardTop - SPOKE_GAP, tDot = tStart - TOP_SPOKE_LEN;
      const dStartX = cardLeft - 8, dStartY = cardTop - 8, dDotX = dStartX - DIAG_SPOKE_LEN, dDotY = dStartY - DIAG_SPOKE_LEN;
      links.innerHTML = `<path id="link-stats" d="M${lineStart} 0 H${dotX}"/><circle cx="${dotX}" cy="0" r="2.5"/>`
        + `<path id="link-exp" d="M${rStart} 0 H${rDot}"/><circle cx="${rDot}" cy="0" r="2.5"/>`
        + `<path id="link-sched" d="M0 ${tStart} V${tDot}"/><circle cx="0" cy="${tDot}" r="2.5"/>`
        + `<path id="link-ledger" d="M${dStartX} ${dStartY} L${dDotX} ${dDotY}"/><circle cx="${dDotX}" cy="${dDotY}" r="2.5"/>`;

      const labelLeft = dotX - LABEL_GAP - spokeLabel.offsetWidth;
      spokeLabel.style.left = labelLeft + 'px';
      spokeLabel.style.top = '0px';
      const statsLeft = labelLeft - STATS_GAP - statsEl.offsetWidth;
      const statsTop = -statsEl.offsetHeight / 2;
      statsEl.style.left = statsLeft + 'px';
      statsEl.style.top = statsTop + 'px';

      const expLabelLeft = rDot + LABEL_GAP;
      expLabel.style.left = expLabelLeft + 'px';
      expLabel.style.top = '0px';
      const expLeft = expLabelLeft + expLabel.offsetWidth + STATS_GAP;
      const expTop = -expList.offsetHeight / 2;
      expList.style.left = expLeft + 'px';
      expList.style.top = expTop + 'px';

      const schedLabelCenter = tDot - LABEL_GAP - schedLabel.offsetHeight / 2;
      schedLabel.style.left = -schedLabel.offsetWidth / 2 + 'px';
      schedLabel.style.top = schedLabelCenter + 'px';
      const schedTop = schedLabelCenter - schedLabel.offsetHeight / 2 - 12 - schedEl.offsetHeight;
      schedEl.style.left = -schedEl.offsetWidth / 2 + 'px';
      schedEl.style.top = schedTop + 'px';

      const ledgerLabelCenter = dDotY - LABEL_GAP - ledgerLabel.offsetHeight / 2;
      ledgerLabel.style.left = dDotX - ledgerLabel.offsetWidth / 2 + 'px';
      ledgerLabel.style.top = ledgerLabelCenter + 'px';
      const ledgerLeft = dDotX + ledgerLabel.offsetWidth / 2 - ledgerEl.offsetWidth;
      const ledgerTop = ledgerLabelCenter - ledgerLabel.offsetHeight / 2 - 12 - ledgerEl.offsetHeight;
      ledgerEl.style.left = ledgerLeft + 'px';
      ledgerEl.style.top = ledgerTop + 'px';

      const bStartX = -cardLeft + 8, bStartY = -cardTop + 8, bDotX = bStartX + DIAG_SPOKE_LEN, bDotY = bStartY + DIAG_SPOKE_LEN;
      links.insertAdjacentHTML('beforeend', `<path id="link-dash" d="M${bStartX} ${bStartY} L${bDotX} ${bDotY}"/><circle cx="${bDotX}" cy="${bDotY}" r="2.5"/>`);
      const dashLabelCenter = bDotY + LABEL_GAP + dashLabel.offsetHeight / 2;
      dashLabel.style.left = bDotX - dashLabel.offsetWidth / 2 + 'px';
      dashLabel.style.top = dashLabelCenter + 'px';
      const dashLeft = bDotX - dashEl.offsetWidth / 2;
      const dashTop = dashLabelCenter + dashLabel.offsetHeight / 2 + 12;
      dashEl.style.left = dashLeft + 'px';
      dashEl.style.top = dashTop + 'px';

      const minX = Math.min(statsLeft, ledgerLeft), maxX = Math.max(expLeft + expList.offsetWidth, dashLeft + dashEl.offsetWidth);
      const top = Math.min(cardTop, statsTop, expTop, schedTop, ledgerTop);
      const bottom = Math.max(-cardTop, -statsTop, expTop + expList.offsetHeight, dashTop + dashEl.offsetHeight);
      bounds.tree = { x: minX, y: top, w: maxX - minX, h: bottom - top };
      bounds.root = { x: cardLeft, y: cardTop, w: cardEl.offsetWidth, h: cardEl.offsetHeight };
    }

    const litTimers = {};
    function light(id = 'stats') {
      const p = links.querySelector('#link-' + id);
      if (!p) return;
      p.classList.add('lit');
      clearTimeout(litTimers[id]);
      litTimers[id] = setTimeout(() => p.classList.remove('lit'), 250);
    }

    function renderMetrics(pulse = true) {
      for (const l of Object.values(leafById)) {
        const v = l.value(metrics);
        const d = l.detail ? l.detail(metrics) : '';
        const tip = d ? `${l.proxy} · ${d}` : l.proxy;
        if (l.el.title !== tip) l.el.title = tip;
        if (l.valueEl.textContent === v) continue;
        l.valueEl.textContent = v;
        if (pulse && l.rendered) {
          l.el.classList.add('pulse');
          clearTimeout(l.pulseTimer);
          l.pulseTimer = setTimeout(() => l.el.classList.remove('pulse'), 700);
          light();
        }
        l.rendered = true;
      }
      $('seenCount').textContent = metrics.impressions ? `Seen ${metrics.impressions}×` : '';
      renderDashboard();
    }

    /* ---------------- Canvas pan & zoom ---------------- */
    const canvasEl = $('canvas'), world = $('world');
    const view = { x: 0, y: 0, k: 1 };
    const pointers = new Map();
    let pinch = null, moved = false, userPanned = false;

    function applyView() {
      world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
      const s = 22 * view.k;
      canvasEl.style.backgroundSize = `${s}px ${s}px`;
      canvasEl.style.backgroundPosition = `${view.x % s}px ${view.y % s}px`;
    }
    function localPoint(clientX, clientY) {
      const r = canvasEl.getBoundingClientRect();
      return [clientX - r.left, clientY - r.top];
    }
    function zoomAt(cx, cy, k) {
      k = Math.min(3, Math.max(0.2, k));
      view.x = cx - (cx - view.x) * (k / view.k);
      view.y = cy - (cy - view.y) * (k / view.k);
      view.k = k;
      applyView();
    }
    // Fit the whole tree once a photo is registered; otherwise just the card.
    function fit() {
      userPanned = false;
      const b = (card.target ? bounds.tree : bounds.root) || { x: -130, y: -150, w: 260, h: 300 };
      const scanning = document.body.classList.contains('scanning');
      const top = scanning ? 0 : 56;
      const cw = canvasEl.clientWidth, ch = canvasEl.clientHeight - top, pad = 32;
      const k = Math.max(0.2, Math.min(1, (cw - pad) / b.w, (ch - pad) / b.h));
      view.k = k;
      view.x = cw / 2 - (b.x + b.w / 2) * k;
      view.y = top + ch / 2 - (b.y + b.h / 2) * k;
      applyView();
    }

    canvasEl.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, input, [contenteditable]')) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = false;
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k };
      }
      canvasEl.classList.add('dragging');
    });
    canvasEl.addEventListener('pointermove', (e) => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      // Capture only once a drag starts: capturing on pointerdown makes Chrome
      // retarget the click to the canvas, so taps on the card never register.
      if (!canvasEl.hasPointerCapture(e.pointerId)) canvasEl.setPointerCapture(e.pointerId);
      userPanned = true;
      p.x = e.clientX; p.y = e.clientY;
      if (pointers.size === 1) { view.x += dx; view.y += dy; applyView(); }
      else if (pointers.size === 2 && pinch) {
        const [a, b] = [...pointers.values()];
        zoomAt(...localPoint((a.x + b.x) / 2, (a.y + b.y) / 2), pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
      }
    });
    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvasEl.classList.remove('dragging');
    };
    canvasEl.addEventListener('pointerup', endPointer);
    canvasEl.addEventListener('pointercancel', endPointer);
    canvasEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      userPanned = true;
      if (e.ctrlKey || e.metaKey) zoomAt(...localPoint(e.clientX, e.clientY), view.k * Math.exp(-e.deltaY * 0.01));
      else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
    }, { passive: false });
    ['gesturestart', 'gesturechange'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
    $('recenter').onclick = fit;
    // Chrome's viewport often settles after load; keep things fitted until the user moves the canvas.
    addEventListener('resize', () => (userPanned ? applyView() : fit()));

    /* ---------------- Card UI ---------------- */
    function setStatus(text, state = '') {
      $('statusText').textContent = text;
      $('statusDot').className = 'dot ' + state;
    }
    function renderCard() {
      $('title').textContent = card.title;
      const photoEl = $('photo');
      photoEl.querySelector('img')?.remove();
      if (card.photo) {
        const img = new Image();
        img.src = card.photo;
        img.alt = 'Registered photo';
        photoEl.prepend(img);
      }
      photoEl.classList.toggle('has-img', !!card.photo);
      $('photoHint').hidden = !!card.photo;
      $('scanBtn').disabled = !card.target;
      tree.classList.toggle('empty', !card.target);
      links.style.display = card.target ? '' : 'none';
      $('resetBtn').hidden = !card.photo;
      if (!card.photo) setStatus('No photo registered');
      else if (card.target) setStatus('Photo registered', 'ready');
      else if (!registeringLocally) setStatus('Registering on another device…', 'busy');
      renderDashboard();
    }

    $('title').addEventListener('input', () => {
      card.title = $('title').textContent.trim() || 'Untitled';
      save();
      put('title', { value: card.title, by: clientId });
    });
    $('title').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
    $('photo').addEventListener('click', () => { if (!moved) $('fileInput').click(); });
    $('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (file) await setTriggerPhoto(file);
    });
    // Resets the whole demo — photo, title and metrics — on every connected device.
    $('resetBtn').onclick = () => {
      if (!confirm('Reset everything (photo, title and metrics) on all devices?')) return;
      resetEverything();
    };
    function resetMetrics() {
      Object.assign(metrics, blankMetrics());
      card.seen = 0;
      save();
      saveMetrics();
      renderMetrics(false);
    }

    /* ---------------- Trigger photo → image target ---------------- */
    let mindar = null, registeringLocally = false;
    const loadMindAR = () => (mindar ??= import(MINDAR_URL));

    function fileToImage(file, maxSide = 1024) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(img.src);
          resolve(c.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    const bufToB64 = (buf) => {
      const bytes = new Uint8Array(buf); let s = '';
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(s);
    };
    const b64ToBuf = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;

    async function setTriggerPhoto(file) {
      $('scanBtn').disabled = true;
      setStatus('Registering photo…', 'busy');
      const bar = $('progress');
      bar.hidden = false; bar.firstElementChild.style.width = '0%';
      registeringLocally = true;
      try {
        card.photo = await fileToImage(file);
        card.photoId = Date.now().toString(36) + clientId;
        card.target = null;
        put('photo', { data: card.photo, id: card.photoId, by: clientId });
        put('target', null);
        resetMetrics();
        renderCard();
        setStatus('Registering photo…', 'busy');
        const { Compiler } = await loadMindAR();
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = card.photo; });
        const compiler = new Compiler();
        await compiler.compileImageTargets([img], (p) => { bar.firstElementChild.style.width = p.toFixed(0) + '%'; });
        card.target = bufToB64(await compiler.exportData());
        save();
        put('target', { data: card.target, id: card.photoId, by: clientId });
        renderCard();
        if (!userPanned) fit();
      } catch (err) {
        console.error(err);
        setStatus('Could not register — try a more detailed photo', '');
      } finally {
        registeringLocally = false;
        bar.hidden = true;
      }
    }

    /* ---------------- Impression tracking (passive proxies) ---------------- */
    let imp = null, gapTimer = null, lastEndAt = 0, leanStart = null;
    // Local impression if this device is scanning, otherwise the other device's live watch time.
    const liveDwell = () => (imp ? (imp.lostAt ?? Date.now()) - imp.start : remoteLive?.inView ? remoteLive.dwellMs : 0);

    function onFound() {
      if (gapTimer) {                       // brief dropout: same impression continues
        clearTimeout(gapTimer); gapTimer = null;
        imp.lostAt = null;
        showFound(true, 'Photo detected');
        pushLive(true);
        return;
      }
      const now = Date.now();
      imp = { start: now, lostAt: null, baseZ: null, viewed: false, completed: false, leaned: false, actions: {} };
      metrics.impressions++;
      const rewatch = !!lastEndAt && now - lastEndAt <= REWATCH_MS;
      if (rewatch) metrics.rewatches++;
      card.seen = metrics.impressions;
      save(); saveMetrics();
      renderMetrics();
      setRail(true);
      showFound(true, 'Photo detected');
      cardEl.classList.add('seen');
      const flash = $('flash');
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      navigator.vibrate?.(40);
      const exp = pickExperience();
      if (exp) showExperience(exp);
      logImpressionStart(rewatch);
      pushLive(true);
      onTriggerSeen(card, metrics);
    }

    function onLost() {
      if (!imp) return;
      imp.lostAt = Date.now();
      leanStart = null;
      showFound(false, 'Point at the registered photo');
      gapTimer = setTimeout(endImpression, GAP_MS);
      pushLive(true);
    }

    function endImpression() {
      clearTimeout(gapTimer); gapTimer = null;
      if (!imp) return;
      const end = imp.lostAt ?? Date.now();
      const dwell = end - imp.start;
      logImpressionEnd(end, dwell);
      if (dwell < HOOK_MS) metrics.skips++;
      metrics.totalDwellMs += dwell;
      metrics.maxDwellMs = Math.max(metrics.maxDwellMs, dwell);
      lastEndAt = end;
      imp = null;
      saveMetrics();
      renderMetrics();
      setRail(false);
      cardEl.classList.remove('seen');
      hideExperience();
      pushLive(true);
      onTriggerLost(card, metrics);
    }

    function onFrame(m) {
      if (!imp || !m) return;
      const z = Math.abs(m[14]);
      if (!z) return;
      if (imp.baseZ == null) { imp.baseZ = z; return; }
      if (z < imp.baseZ * LEAN_RATIO) {
        leanStart ??= Date.now();
        if (!imp.leaned && Date.now() - leanStart >= LEAN_MS) {
          imp.leaned = true;
          metrics.leanIns++;
          logAction('lean-in');
          saveMetrics();
          renderMetrics();
        }
      } else leanStart = null;
    }

    // Live ticker: hook/completion thresholds and watch time update while the photo is in view.
    setInterval(() => {
      if (!imp) return;
      const d = liveDwell();
      let changed = false;
      if (!imp.viewed && d >= HOOK_MS) { imp.viewed = true; metrics.views++; changed = true; }
      if (!imp.completed && d >= COMPLETE_MS) { imp.completed = true; metrics.completed++; changed = true; }
      if (changed) saveMetrics();
      renderMetrics(changed);
      pushLive();
    }, 200);

    /* ---------------- In-camera actions (active proxies) ---------------- */
    const ACTION_KEYS = { like: 'likes', save: 'saves', share: 'shares', follow: 'follows', tap: 'taps' };
    const ENGAGEMENT_ACTIONS = new Set(['like', 'comment', 'save', 'share']);
    function markEngaged(forImp, type) {
      if (!forImp || forImp.engaged || !ENGAGEMENT_ACTIONS.has(type)) return;
      forImp.engaged = true;
      metrics.engaged++;
    }
    const actionButtons = () => [...document.querySelectorAll('#scanner [data-act]')];

    function setRail(on) {
      $('scanner').classList.toggle('off', !on);
      if (on) actionButtons().forEach((b) => b.classList.remove('active'));
      if (!on) $('commentBar').hidden = true;
    }

    let nudgeTimer = null;
    function nudge() {
      $('scanText').textContent = 'Point at the photo first';
      clearTimeout(nudgeTimer);
      nudgeTimer = setTimeout(() => { if (!imp) $('scanText').textContent = 'Point at the registered photo'; }, 1200);
    }

    function act(type) {
      if (!imp) return nudge();
      if (type === 'comment') {
        $('commentBar').hidden = false;
        $('commentInput').focus();
        return;
      }
      if (imp.actions[type]) return;      // one of each per impression, like the real apps
      imp.actions[type] = true;
      actionButtons().filter((b) => b.dataset.act === type).forEach((b) => b.classList.add('active'));
      metrics[ACTION_KEYS[type]]++;
      markEngaged(imp, type);
      logAction(type);
      saveMetrics();
      renderMetrics();
    }

    actionButtons().forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); act(b.dataset.act); }));

    $('commentBar').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('commentInput').value.trim();
      $('commentInput').value = '';
      $('commentBar').hidden = true;
      $('commentInput').blur();
      if (!text) return;
      metrics.comments++;
      metrics.lastComment = text.slice(0, 60);
      markEngaged(imp, 'comment');
      logAction('comment', { text: text.slice(0, 60) });
      saveMetrics();
      renderMetrics();
    });

    // Double-tap the viewfinder to like (with a heart burst).
    let lastTap = 0;
    $('scanner').addEventListener('pointerup', (e) => {
      if (e.target.closest('button, input, form')) return;
      const now = Date.now();
      if (now - lastTap < 320) {
        lastTap = 0;
        if (!imp) return nudge();
        const r = $('scanner').getBoundingClientRect();
        const heart = Object.assign(document.createElement('div'), { className: 'heart', textContent: '❤️' });
        heart.style.left = e.clientX - r.left + 'px';
        heart.style.top = e.clientY - r.top + 'px';
        $('scanner').append(heart);
        setTimeout(() => heart.remove(), 800);
        act('like');
      } else lastTap = now;
    });

    /* ---------------- Scanner ---------------- */
    const video = $('video');
    let stream = null, controller = null, visible = false;

    async function openScanner() {
      document.body.classList.add('scanning');
      $('scanner').hidden = false;
      pushLive(true);
      if (sync.on) sync.api.onDisconnect(roomRef('live')).remove();
      startLocation();
      setRail(false);
      requestAnimationFrame(fit);
      $('scanTitle').textContent = card.title;
      $('scanThumb').src = card.photo;
      showFound(false, 'Starting camera…');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false,
        });
        video.srcObject = stream;
        await video.play();
        await new Promise((r) => (video.videoWidth ? r() : video.addEventListener('loadedmetadata', r, { once: true })));
        video.width = video.videoWidth;
        video.height = video.videoHeight;

        showFound(false, 'Loading detector…');
        const { Controller } = await loadMindAR();
        controller = new Controller({
          inputWidth: video.videoWidth,
          inputHeight: video.videoHeight,
          maxTrack: 1,
          onUpdate: ({ type, worldMatrix }) => {
            if (type !== 'updateMatrix') return;
            if (worldMatrix) {
              if (!visible) { visible = true; onFound(); }
              onFrame(worldMatrix);
            } else if (visible) { visible = false; onLost(); }
          },
        });
        controller.addImageTargetsFromBuffer(b64ToBuf(card.target));
        await controller.dummyRun(video);
        controller.processVideo(video);
        showFound(false, 'Point at the registered photo');
      } catch (err) {
        console.error(err);
        showFound(false, err.name === 'NotAllowedError' ? 'Camera permission denied' : 'Camera unavailable');
      }
    }

    function closeScanner() {
      controller?.stopProcessVideo();
      controller = null;
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      visible = false;
      if (imp) { imp.lostAt ??= Date.now(); endImpression(); }
      $('scanner').hidden = true;
      stopLocation();
      hideExperience();
      document.body.classList.remove('scanning');
      pushLive(true);
      requestAnimationFrame(fit);
    }

    function showFound(found, text) {
      $('scanStatus').classList.toggle('found', found);
      $('guide').classList.toggle('found', found);
      $('scanText').textContent = text;
    }

    $('scanBtn').onclick = openScanner;
    $('closeScan').onclick = closeScanner;
    document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeScanner(); });

    /* ---------------- Schedule: overall campaign dates ---------------- */
    const SCHED_KEY = 'contextCanvas.schedule.v1';
    const DAY_MS = 86400000;
    let schedule = (({ start, end }) => (start && end ? { start, end } : null))(loadJSON(SCHED_KEY));
    let schedEditing = false;

    const parseDay = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    function saveScheduleLocal() {
      try { schedule ? localStorage.setItem(SCHED_KEY, JSON.stringify(schedule)) : localStorage.removeItem(SCHED_KEY); } catch {}
    }
    const linkButton = (text, onclick) => Object.assign(document.createElement('button'), { className: 'exp-link', type: 'button', textContent: text, onclick });

    function renderSchedule() {
      schedEl.replaceChildren();
      if (schedEditing) schedEl.append(scheduleForm());
      else if (schedule) schedEl.append(...scheduleSummary());
      else schedEl.append(linkButton('+ Set campaign dates', () => { schedEditing = true; renderSchedule(); }));
      renderDashboard();
      if (bounds.tree) layout();
    }

    function scheduleSummary() {
      const start = parseDay(schedule.start), end = parseDay(schedule.end);
      const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const total = Math.round((end - start) / DAY_MS) + 1;
      const day = Math.round((today - start) / DAY_MS) + 1;
      const fmt = (d, year) => d.toLocaleDateString([], { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}) });
      const duration = total >= 45 ? `≈${Math.round(total / 30.44)} months` : plural(total, 'day');
      let status, progress;
      if (day < 1) { status = `Starts in ${plural(1 - day, 'day')}`; progress = 0; }
      else if (day > total) { status = `Ended ${plural(day - total, 'day')} ago`; progress = 1; }
      else { status = `Day ${day} of ${total} · ${plural(total - day, 'day')} left`; progress = day / total; }

      const dates = Object.assign(document.createElement('div'), {
        className: 'sched-dates', textContent: `${fmt(start, start.getFullYear() !== end.getFullYear())} – ${fmt(end, true)}`,
      });
      const bar = Object.assign(document.createElement('div'), { className: 'sched-bar' });
      bar.append(Object.assign(document.createElement('i'), { style: `width:${(progress * 100).toFixed(1)}%` }));
      const meta = Object.assign(document.createElement('div'), { className: 'sched-meta', textContent: `${duration} · ${status}` });
      return [dates, bar, meta, linkButton('Edit', () => { schedEditing = true; renderSchedule(); })];
    }

    function scheduleForm() {
      const form = Object.assign(document.createElement('form'), { className: 'sched-form', noValidate: true });
      form.innerHTML = `<div class="sched-inputs">
          <label>Start<input type="date" name="start"></label>
          <label>End<input type="date" name="end"></label>
        </div>
        <div class="sched-error"></div>
        <div class="sched-actions"><button class="btn sm" type="submit">Save</button></div>`;
      const { start, end } = form.elements;
      start.value = schedule?.start || '';
      end.value = schedule?.end || '';
      form.querySelector('.sched-actions').append(linkButton('Cancel', () => { schedEditing = false; renderSchedule(); }));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const error = form.querySelector('.sched-error');
        if (!start.value || !end.value) { error.textContent = 'Pick a start and end date'; return; }
        if (end.value <= start.value) { error.textContent = 'End must be after start'; return; }
        schedule = { start: start.value, end: end.value };
        schedEditing = false;
        saveScheduleLocal();
        put('schedule', { ...schedule, by: clientId });
        renderSchedule();
      });
      return form;
    }

    function applySchedule(v) {
      if (v?.by === clientId) return;
      schedule = v?.start && v?.end ? { start: v.start, end: v.end } : null;
      saveScheduleLocal();
      if (!schedEditing) renderSchedule();
    }

    // Keep "Day N of N" current across midnight.
    setInterval(() => { if (schedule && !schedEditing) renderSchedule(); }, 60000);

    /* ---------------- Ledger: stakeholder allocation (SPAT fixed at 3%) ---------------- */
    // Stored in basis points so percentages add up exactly (10000 bps = 100%).
    const LEDGER_KEY = 'contextCanvas.ledger.v1';
    const PLATFORM_NAME = 'SPAT', PLATFORM_BPS = 300, STAKEHOLDER_BPS = 10000 - PLATFORM_BPS;
    let stakeholders = loadJSON(LEDGER_KEY);
    let ledgerAdding = false;

    const fmtPct = (bps) => `${+(bps / 100).toFixed(2)}%`;
    const allocatedBps = () => Object.values(stakeholders).reduce((n, x) => n + (x.bps || 0), 0);
    function saveLedgerLocal() { try { localStorage.setItem(LEDGER_KEY, JSON.stringify(stakeholders)); } catch {} }

    function renderLedger() {
      const list = Object.values(stakeholders).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const used = allocatedBps(), open = STAKEHOLDER_BPS - used;
      ledgerEl.replaceChildren();

      const sum = Object.assign(document.createElement('div'), { className: 'ledger-sum' + (open === 0 ? ' done' : open < 0 ? ' over' : '') });
      sum.append(
        Object.assign(document.createElement('span'), { textContent: `Stakeholders ${fmtPct(used)} of ${fmtPct(STAKEHOLDER_BPS)}` }),
        Object.assign(document.createElement('span'), { className: 'status', textContent: open === 0 ? 'Fully allocated' : open > 0 ? `${fmtPct(open)} open` : `Over by ${fmtPct(-open)}` }),
      );
      const bar = Object.assign(document.createElement('div'), { className: 'ledger-bar' });
      // Green progress toward 97% (one segment per stakeholder), SPAT's 3% pinned at the end.
      const fill = open < 0 ? '#c0392b' : 'var(--ok)';
      list.forEach((x) => bar.append(Object.assign(document.createElement('i'), { style: `flex:0 0 ${x.bps / 100}%;background:${fill}` })));
      bar.append(Object.assign(document.createElement('i'), { style: `flex:0 0 ${PLATFORM_BPS / 100}%;margin-left:auto;background:var(--ink)` }));
      ledgerEl.append(sum, bar);

      for (const x of list) {
        ledgerEl.append(ledgerRow(x.name, '', x.bps, () => {
          if (!confirm(`Remove ${x.name} from the ledger?`)) return;
          delete stakeholders[x.id];
          saveLedgerLocal();
          put(`ledger/${x.id}`, null);
          renderLedger();
        }));
      }
      ledgerEl.append(ledgerRow(PLATFORM_NAME, 'platform fee', PLATFORM_BPS, null));

      if (ledgerAdding) {
        ledgerEl.append(ledgerForm(open));
        ledgerEl.querySelector('input')?.focus({ preventScroll: true });
      } else if (open > 0) {
        ledgerEl.append(linkButton('+ Add stakeholder', () => { ledgerAdding = true; renderLedger(); }));
      }
      renderDashboard();
      if (bounds.tree) layout();
    }

    function ledgerRow(name, role, bps, onRemove) {
      const row = Object.assign(document.createElement('div'), {
        className: 'ledger-row' + (onRemove ? '' : ' fee'),
        title: `$${(bps / 100).toFixed(2)} of every $100 sale`,
      });
      row.append(Object.assign(document.createElement('span'), { className: 'name', textContent: name }));
      if (role) row.append(Object.assign(document.createElement('span'), { className: 'role', textContent: role }));
      row.append(Object.assign(document.createElement('b'), { textContent: fmtPct(bps) }));
      if (onRemove) {
        const rm = Object.assign(document.createElement('button'), { className: 'rm', type: 'button', textContent: '×', onclick: onRemove });
        rm.setAttribute('aria-label', `Remove ${name}`);
        row.append(rm);
      } else {
        row.append(Object.assign(document.createElement('span'), { className: 'rm-space' }));
      }
      return row;
    }

    function ledgerForm(open) {
      const form = Object.assign(document.createElement('form'), { className: 'ledger-form', noValidate: true });
      form.innerHTML = `<input data-field="name" placeholder="Stakeholder name" maxlength="60" autocomplete="off" aria-label="Stakeholder name">
        <input data-field="pct" placeholder="${fmtPct(Math.max(open, 0))}" inputmode="decimal" autocomplete="off" aria-label="Percentage">
        <div class="sched-error"></div>
        <div class="sched-actions"><button class="btn sm" type="submit">Add</button></div>`;
      form.querySelector('.sched-actions').append(linkButton('Cancel', () => { ledgerAdding = false; renderLedger(); }));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const error = form.querySelector('.sched-error');
        const name = form.querySelector('[data-field=name]').value.trim();
        const bps = Math.round(parseFloat(form.querySelector('[data-field=pct]').value.replace('%', '').replace(',', '.')) * 100);
        const openNow = STAKEHOLDER_BPS - allocatedBps();
        const taken = [PLATFORM_NAME, ...Object.values(stakeholders).map((x) => x.name)].some((n) => n.toLowerCase() === name.toLowerCase());
        if (!name) { error.textContent = 'Add a name'; return; }
        if (taken) { error.textContent = `${name} is already on the ledger`; return; }
        if (!(bps > 0)) { error.textContent = 'Enter a percentage above 0'; return; }
        if (bps > openNow) { error.textContent = `Only ${fmtPct(openNow)} left to allocate`; return; }
        const x = { id: 's' + Date.now().toString(36) + clientId, name, bps, createdAt: Date.now() };
        stakeholders[x.id] = x;
        saveLedgerLocal();
        put(`ledger/${x.id}`, x);
        ledgerAdding = openNow - bps > 0;   // keep adding until stakeholders reach 97%
        renderLedger();
      });
      return form;
    }

    function applyLedger(v) {
      stakeholders = v || {};
      saveLedgerLocal();
      if (!ledgerAdding) renderLedger();
    }

    /* ---------------- Experiences: HTML shown in the camera, by location and time ---------------- */
    const EXP_KEY = 'contextCanvas.experiences.v1';
    const MAX_HTML_BYTES = 300 * 1024;
    let experiences = loadJSON(EXP_KEY);
    const expanded = new Set();
    let currentExp = null, here = null, geoWatch = null, lastExpKey = '';

    const fmtWhen = (ts) => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

    function saveExperiencesLocal() { try { localStorage.setItem(EXP_KEY, JSON.stringify(experiences)); } catch {} }
    function upsertExperience(x) {
      experiences[x.id] = x;
      saveExperiencesLocal();
      put(`experiences/${x.id}`, x);
      renderExperiences();
    }
    function removeExperience(id) {
      delete experiences[id];
      expanded.delete(id);
      saveExperiencesLocal();
      put(`experiences/${id}`, null);
      renderExperiences();
    }
    function applyExperiences(v) {
      const plays = (m) => Object.values(m).reduce((n, x) => n + (x.plays || 0), 0);
      const before = plays(experiences);
      experiences = v || {};
      saveExperiencesLocal();
      if (plays(experiences) > before) light('exp');
      renderExperiences();
    }

    // Canvas node: titles with play/pause; tap a title to expand its details.
    function renderExperiences() {
      const list = Object.values(experiences).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const playingId = currentExp?.id || remoteLive?.playing || null;
      const key = JSON.stringify([list.map((x) => [x.id, x.title, x.active, x.plays, x.lastPlayedAt]), [...expanded], playingId]);
      if (key === lastExpKey) return;
      lastExpKey = key;

      expList.replaceChildren();
      if (!list.length) expList.append(Object.assign(document.createElement('div'), { className: 'exp-empty', textContent: 'No experiences yet' }));
      for (const x of list) {
        const row = document.createElement('div');
        const head = Object.assign(document.createElement('div'), { className: 'exp-head' });
        const play = Object.assign(document.createElement('button'), {
          className: 'exp-play' + (x.active ? ' on' : ''), textContent: x.active ? '❚❚' : '▶',
        });
        play.setAttribute('aria-label', (x.active ? 'Pause ' : 'Play ') + x.title);
        play.onclick = () => upsertExperience({ ...x, active: !x.active });
        const title = Object.assign(document.createElement('button'), { className: 'exp-title' + (x.active ? '' : ' paused'), textContent: x.title });
        title.setAttribute('aria-expanded', expanded.has(x.id));
        title.onclick = () => { expanded.has(x.id) ? expanded.delete(x.id) : expanded.add(x.id); renderExperiences(); };
        head.append(play, title);
        if (playingId === x.id) head.append(Object.assign(document.createElement('span'), { className: 'exp-now', textContent: '● showing' }));
        row.append(head);
        if (expanded.has(x.id)) row.append(experienceDetails(x));
        expList.append(row);
      }
      const add = Object.assign(document.createElement('button'), { className: 'exp-link', textContent: '+ Add experience' });
      add.onclick = openDrawer;
      expList.append(add);
      renderDashboard();
      if (bounds.tree) layout();
    }

    function experienceDetails(x) {
      const dl = Object.assign(document.createElement('dl'), { className: 'exp-details' });
      const item = (k, v) => dl.append(Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: v }));
      item('Where', x.lat != null ? `${x.lat.toFixed(4)}, ${x.lng.toFixed(4)} · ${x.radius} m` : 'Anywhere');
      item('When', x.start || x.end ? `${x.start ? fmtWhen(x.start) : 'Now'} → ${x.end ? fmtWhen(x.end) : 'No end'}` : 'Any time');
      item('Status', x.active ? 'Playing' : 'Paused');
      item('Shown', x.plays ? `${x.plays}×` : 'Not yet');
      if (x.history?.length) {
        item('Log', x.history.slice().reverse()
          .map((h) => fmtWhen(h.at) + (h.lat != null ? ` · ${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}` : '')).join('\n'));
      }
      const preview = Object.assign(document.createElement('div'), { className: 'exp-preview' });
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', '');           // no scripts, no same-origin access
      frame.title = x.title;
      frame.srcdoc = x.html;
      preview.append(frame);
      const del = Object.assign(document.createElement('button'), { className: 'exp-link', textContent: 'Delete' });
      del.onclick = () => { if (confirm(`Delete “${x.title}”?`)) removeExperience(x.id); };
      dl.append(preview, del);
      return dl;
    }

    // Choose what to show: nearest location match, then date-only, then anywhere/any time.
    function distanceM(a, b) {
      const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
      return 2 * 6371000 * Math.asin(Math.sqrt(h));
    }
    function pickExperience(now = Date.now()) {
      let best = null, bestScore = Infinity;
      for (const x of Object.values(experiences)) {
        if (!x.active || (x.start && now < x.start) || (x.end && now > x.end)) continue;
        let score;
        if (x.lat != null) {
          if (!here) continue;
          const d = distanceM(here, x);
          if (d > x.radius + Math.min(here.acc || 0, 100)) continue;
          score = d;
        } else {
          score = (x.start || x.end ? 2e13 : 4e13) + (x.createdAt || 0);
        }
        if (score < bestScore) { best = x; bestScore = score; }
      }
      return best;
    }

    function showExperience(x) {
      currentExp = x;
      $('expOverlay').querySelector('iframe').srcdoc = x.html;
      $('expOverlay').hidden = false;
      const entry = { at: Date.now(), ...(here ? { lat: +here.lat.toFixed(5), lng: +here.lng.toFixed(5) } : {}) };
      upsertExperience({ ...x, plays: (x.plays || 0) + 1, lastPlayedAt: entry.at, history: [...(x.history || []), entry].slice(-5) });
      light('exp');
    }
    function hideExperience() {
      if (!currentExp) return;
      currentExp = null;
      $('expOverlay').hidden = true;
      $('expOverlay').querySelector('iframe').srcdoc = '';
      renderExperiences();
    }
    $('expClose').onclick = () => { hideExperience(); pushLive(true); };

    // Phone location while scanning (the camera itself can't tell a stadium from a living room).
    function setLocChip(text) { $('locChip').textContent = text; }
    function startLocation() {
      if (!navigator.geolocation) return setLocChip('📍 unavailable');
      setLocChip('📍 locating…');
      geoWatch = navigator.geolocation.watchPosition(
        (p) => {
          here = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) };
          setLocChip(`📍 ±${here.acc} m`);
          pushLive();
        },
        () => setLocChip('📍 off'),
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 },
      );
    }
    function stopLocation() {
      if (geoWatch != null) navigator.geolocation.clearWatch(geoWatch);
      geoWatch = null;
      setLocChip('');
    }

    /* ---- Drawer: add an experience ---- */
    let draft = null;
    function formError(msg) { $('expError').textContent = msg; }
    function openDrawer() {
      draft = null;
      $('expForm').reset();
      $('expRadius').value = '200';
      ['locSet', 'dateSet'].forEach((id) => $(id).classList.remove('on'));
      $('drop').classList.remove('has-file');
      $('drop').querySelectorAll('.file-name, iframe').forEach((n) => n.remove());
      $('dropText').hidden = false;
      formError('');
      $('drawerScrim').hidden = false;
      $('drawer').classList.add('open');
      $('drawer').setAttribute('aria-hidden', 'false');
    }
    function closeDrawer() {
      $('drawer').classList.remove('open');
      $('drawer').setAttribute('aria-hidden', 'true');
      $('drawerScrim').hidden = true;
    }
    $('drawerClose').onclick = closeDrawer;
    $('drawerScrim').onclick = closeDrawer;
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer(); });

    async function loadHtmlFile(file) {
      if (!file) return;
      if (!/\.html?$/i.test(file.name) && file.type !== 'text/html') return formError('Please choose an .html file');
      if (file.size > MAX_HTML_BYTES) return formError('That HTML file is over 300 KB');
      const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
      // No JavaScript for now: strip scripts, embeds, refreshes, inline handlers and javascript: URLs.
      doc.querySelectorAll('script, noscript, iframe, frame, object, embed, meta[http-equiv]').forEach((n) => n.remove());
      doc.querySelectorAll('*').forEach((el) => [...el.attributes].forEach((a) => {
        if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
      }));
      draft = { html: '<!doctype html>\n' + doc.documentElement.outerHTML };
      if (!$('expTitle').value.trim()) $('expTitle').value = (doc.title.trim() || file.name.replace(/\.html?$/i, '')).slice(0, 80);
      const drop = $('drop');
      drop.querySelectorAll('.file-name, iframe').forEach((n) => n.remove());
      $('dropText').hidden = true;
      drop.classList.add('has-file');
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', '');
      frame.title = 'Preview';
      frame.srcdoc = draft.html;
      drop.append(Object.assign(document.createElement('div'), { className: 'file-name', textContent: `${file.name} · tap to replace` }), frame);
      formError('');
    }

    const dropEl = $('drop');
    dropEl.addEventListener('click', () => $('htmlInput').click());
    dropEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('htmlInput').click(); } });
    ['dragenter', 'dragover'].forEach((t) => dropEl.addEventListener(t, (e) => { e.preventDefault(); dropEl.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => dropEl.addEventListener(t, () => dropEl.classList.remove('over')));
    dropEl.addEventListener('drop', (e) => { e.preventDefault(); loadHtmlFile(e.dataTransfer.files[0]); });
    // Stop a missed drop from navigating away from the canvas.
    ['dragover', 'drop'].forEach((t) => addEventListener(t, (e) => e.preventDefault()));
    $('htmlInput').addEventListener('change', (e) => { loadHtmlFile(e.target.files[0]); e.target.value = ''; });

    $('useLoc').onchange = (e) => $('locSet').classList.toggle('on', e.target.checked);
    $('useDates').onchange = (e) => $('dateSet').classList.toggle('on', e.target.checked);
    $('useHere').onclick = () => {
      if (!navigator.geolocation) return formError('Location is not available on this device');
      $('useHere').textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(
        (p) => { $('expLat').value = p.coords.latitude.toFixed(6); $('expLng').value = p.coords.longitude.toFixed(6); $('useHere').textContent = 'Use my location'; },
        () => { formError('Could not get your location'); $('useHere').textContent = 'Use my location'; },
        { enableHighAccuracy: true, timeout: 15000 },
      );
    };

    $('expForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!draft) return formError('Add an HTML file first');
      const title = $('expTitle').value.trim();
      if (!title) return formError('Add a title');
      const x = { id: 'x' + Date.now().toString(36) + clientId, title, html: draft.html, active: true, createdAt: Date.now(), plays: 0 };
      if ($('useLoc').checked) {
        const lat = parseFloat($('expLat').value), lng = parseFloat($('expLng').value), radius = parseFloat($('expRadius').value);
        if (!(lat >= -90 && lat <= 90) || !(lng >= -180 && lng <= 180)) return formError('Enter a valid latitude and longitude');
        if (!(radius > 0)) return formError('Radius must be more than 0 m');
        Object.assign(x, { lat, lng, radius: Math.round(radius) });
      }
      if ($('useDates').checked) {
        const start = $('expStart').value ? new Date($('expStart').value).getTime() : null;
        const end = $('expEnd').value ? new Date($('expEnd').value).getTime() : null;
        if (!start && !end) return formError('Pick a start and/or end date');
        if (start && end && end <= start) return formError('End must be after start');
        if (start) x.start = start;
        if (end) x.end = end;
      }
      upsertExperience(x);
      closeDrawer();
    });

    /* ---------------- Event log: time-stamped impressions and actions ---------------- */
    // The raw record behind the dashboard: every impression and action, with time, experience, location and device.
    const EVENTS_KEY = 'contextCanvas.events.v1', MAX_LOCAL_EVENTS = 1000;
    const deviceId = (() => {
      try {
        let id = localStorage.getItem('contextCanvas.device');
        if (!id) { id = 'd' + Math.random().toString(36).slice(2, 10); localStorage.setItem('contextCanvas.device', id); }
        return id;
      } catch { return 'd' + Math.random().toString(36).slice(2, 10); }
    })();
    let events = loadJSON(EVENTS_KEY);
    let eventSeq = 0;

    const newEventId = () => `${Date.now().toString(36)}-${deviceId}-${(eventSeq++).toString(36)}`;
    const whereNow = () => (here ? { lat: +here.lat.toFixed(5), lng: +here.lng.toFixed(5), acc: here.acc } : {});

    function writeEvent(id, event) {
      const clean = Object.fromEntries(Object.entries(event).filter(([, v]) => v !== undefined && v !== null));
      events[id] = clean;
      const ids = Object.keys(events);
      if (ids.length > MAX_LOCAL_EVENTS) {
        ids.sort((a, b) => events[a].t - events[b].t).slice(0, ids.length - MAX_LOCAL_EVENTS).forEach((k) => delete events[k]);
      }
      try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); } catch {}
      put(`events/${id}`, clean);
    }

    // Written when the photo comes into view, then completed when the impression ends.
    function logImpressionStart(rewatch) {
      imp.eventId = newEventId();
      imp.expId = currentExp?.id || null;
      imp.event = { type: 'impression', t: imp.start, exp: imp.expId, rewatch, device: deviceId, ...whereNow() };
      writeEvent(imp.eventId, imp.event);
    }
    function logImpressionEnd(end, dwell) {
      if (!imp?.eventId) return;
      const actions = Object.keys(imp.actions);
      writeEvent(imp.eventId, {
        ...imp.event, end, dwellMs: dwell, viewed: dwell >= HOOK_MS, completed: dwell >= COMPLETE_MS,
        leaned: imp.leaned, actions: actions.length ? actions : null,
      });
    }
    function logAction(type, extra = {}) {
      if (!imp?.eventId) return;
      writeEvent(newEventId(), { type, t: Date.now(), imp: imp.eventId, exp: imp.expId, device: deviceId, ...whereNow(), ...extra });
    }

    /* ---------------- Dashboard: setup checklist (the dashboard unlocks when all are done) ---------------- */
    let lastDashKey = '';

    function dashboardChecks() {
      const used = allocatedBps();
      const exps = Object.values(experiences);
      return [
        { id: 'photo', label: 'Photo registered', done: !!card.target },
        { id: 'schedule', label: 'Campaign dates set', done: !!schedule, hint: 'Set a start and end date',
          go: () => { schedEditing = true; renderSchedule(); } },
        { id: 'ledger', label: `Ledger at ${fmtPct(STAKEHOLDER_BPS)}`, done: used === STAKEHOLDER_BPS,
          hint: `${fmtPct(used)} of ${fmtPct(STAKEHOLDER_BPS)} allocated`, go: () => { ledgerAdding = true; renderLedger(); } },
        { id: 'experience', label: 'An active experience', done: exps.some((x) => x.active),
          hint: exps.length ? 'All experiences are paused' : 'Add an HTML experience', go: exps.length ? null : openDrawer },
      ];
    }

    function renderDashboard() {
      if (!dashEl) return;
      const checks = dashboardChecks();
      const doneCount = checks.filter((c) => c.done).length;
      const ready = doneCount === checks.length;
      const key = JSON.stringify([checks.map((c) => [c.done, c.hint]), ready && metrics.impressions]);
      if (key === lastDashKey) return;
      lastDashKey = key;

      dashEl.replaceChildren();
      const head = Object.assign(document.createElement('div'), { className: 'dash-head' + (ready ? ' ready' : '') });
      head.append(
        Object.assign(document.createElement('span'), { textContent: 'Setup' }),
        Object.assign(document.createElement('span'), { className: 'status', textContent: ready ? 'Ready' : `${doneCount} of ${checks.length}` }),
      );
      dashEl.append(head);

      for (const c of checks) {
        const actionable = !c.done && c.go;
        const item = document.createElement(actionable ? 'button' : 'div');
        item.className = 'check' + (c.done ? ' done' : '');
        if (actionable) { item.type = 'button'; item.onclick = c.go; }
        const label = Object.assign(document.createElement('span'), { className: 'check-label', textContent: c.label });
        if (!c.done && c.hint) label.append(Object.assign(document.createElement('small'), { textContent: c.hint }));
        item.append(Object.assign(document.createElement('i'), { textContent: c.done ? '✓' : '' }), label);
        dashEl.append(item);
      }
      if (ready) {
        dashEl.append(Object.assign(document.createElement('div'), {
          className: 'dash-note',
