<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Camera</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    video, #photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    #photo { position: absolute; inset: 0; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0;
      padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-around;
      background: linear-gradient(transparent, rgba(0,0,0,.6)); }
    button, label.btn { font: inherit; color: #fff; background: rgba(255,255,255,.18);
      border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
    #shutter { width: 76px; height: 76px; padding: 0; border-radius: 50%;
      background: #fff; box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff; }
    #shutter:active { transform: scale(.94); }
    #message { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 32px; text-align: center; }
    [hidden] { display: none !important; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <img id="photo" alt="Captured photo" hidden>
  </div>

  <div id="message" hidden>
    <p id="messageText">Camera access is needed to take a photo.</p>
    <button id="retry">Allow camera</button>
    <label class="btn">Use iPhone camera app
      <input id="fileInput" type="file" accept="image/*" capture="environment">
    </label>
  </div>

  <div class="bar" id="liveBar" hidden>
    <button id="flip" aria-label="Switch camera">Flip</button>
    <button id="shutter" aria-label="Take photo"></button>
    <span style="width:64px"></span>
  </div>

  <div class="bar" id="reviewBar" hidden>
    <button id="retake">Retake</button>
    <button id="use">Use photo</button>
  </div>

  <canvas id="canvas" hidden></canvas>

  <script>
    const $ = (id) => document.getElementById(id);
    const video = $('video'), photo = $('photo'), canvas = $('canvas');
    let stream = null, facing = 'environment', lastBlob = null;

    function show(mode) {
      $('liveBar').hidden = mode !== 'live';
      $('reviewBar').hidden = mode !== 'review';
      $('message').hidden = mode !== 'message';
      video.hidden = mode !== 'live';
      photo.hidden = mode !== 'review';
    }

    async function startCamera() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (!navigator.mediaDevices?.getUserMedia) {
        $('messageText').textContent = 'Live camera is not available here (the page must be opened over HTTPS).';
        $('retry').hidden = true;
        return show('message');
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();
        show('live');
      } catch (err) {
        $('messageText').textContent = err.name === 'NotAllowedError'
          ? 'Camera permission was denied. Tap "Allow camera" to try again, or use the iPhone camera app.'
          : 'Could not start the camera: ' + err.message;
        show('message');
      }
    }

    function review(blob) {
      lastBlob = blob;
      photo.src = URL.createObjectURL(blob);
      show('review');
    }

    $('shutter').onclick = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(review, 'image/jpeg', 0.92);
    };

    $('flip').onclick = () => {
      facing = facing === 'environment' ? 'user' : 'environment';
      startCamera();
    };

    $('retake').onclick = () => {
      URL.revokeObjectURL(photo.src);
      startCamera();
    };

    // "Use photo": share/save via the iOS share sheet when available.
    // Replace this with an upload to your own endpoint if you need the input server-side.
    $('use').onclick = async () => {
      const file = new File([lastBlob], 'photo-' + Date.now() + '.jpg', { type: 'image/jpeg' });
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch (_) {}
      } else {
        const a = document.createElement('a');
        a.href = photo.src;
        a.download = file.name;
        a.click();
      }
    };

    $('retry').onclick = startCamera;
    $('fileInput').onchange = (e) => {
      const f = e.target.files[0];
      if (f) review(f);
    };

    startCamera();
  </script>
</body>
</html>
